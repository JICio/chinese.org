<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>漢字龍虎鬥 — Chinese.org</title>
  <meta name="description" content="兩人對戰：輪流說一句話，說出的字飛向對方，在空中碰撞。旗鼓相當的字會交換偏旁變成新字——打碰上江，變成扛和汀！">
  <meta name="theme-color" content="#0b0b0a">
  <meta property="og:title" content="漢字龍虎鬥 — Chinese.org">
  <meta property="og:description" content="說話對戰，漢字相撞，偏旁重組成新字！">
  <meta property="og:image" content="https://chinese.org/assets/og-premium.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chinese.org/pk.html">
  <link rel="icon" href="assets/logo-hua.png" type="image/png">
  <style>
    :root {
      --ink: #0b0b0a;
      --ink-soft: #161714;
      --paper: #f1eee6;
      --coral: #e36a4c;
      --gold: #c39a54;
      --led-gold: #ffd98a;
      --led-red: #ff6b52;
      --jade: #7fd8b8;
      --blue: #7ab8ff;
      --muted: rgba(241, 238, 230, .52);
      --line: rgba(241, 238, 230, .14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "PingFang TC", "Hiragino Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    /* 手機豎拿時整體轉 90°（橫版遊戲） */
    @media (max-width: 820px) and (orientation: portrait) and (hover: none) and (pointer: coarse) {
      body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvh;
        height: 100dvw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 10, .92);
      z-index: 20;
    }

    .bar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--paper);
      text-decoration: none;
    }

    .bar-brand img { width: 22px; height: 22px; filter: invert(1); }

    .bar-brand strong { font-size: 10px; font-weight: 800; letter-spacing: .16em; }

    .bar-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--led-gold);
    }

    .round-pill {
      padding: 3px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ---------- 戰場 ---------- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 50%, rgba(227, 106, 76, .14), transparent 42%),
        radial-gradient(circle at 88% 50%, rgba(195, 154, 84, .14), transparent 42%),
        var(--ink);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .05) 1px, transparent 1.5px);
      background-size: 13px 13px;
    }

    .side {
      position: relative;
      z-index: 3;
      width: 118px;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
    }

    .side .face {
      font-size: 58px;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(227, 106, 76, .45));
      transition: transform 200ms ease;
    }

    .side.right .face { filter: drop-shadow(0 0 14px rgba(195, 154, 84, .5)); }

    .side .face.is-hit { animation: shake 400ms ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px) rotate(-6deg); }
      75% { transform: translateX(7px) rotate(6deg); }
    }

    .side .name { font-size: 16px; font-weight: 800; letter-spacing: .18em; }

    .side.left .name { color: var(--led-red); }
    .side.right .name { color: var(--led-gold); }

    .side .hp { font-size: 15px; letter-spacing: 2px; }

    .side .points { font-size: 15px; color: var(--muted); }

    .side .points b { color: var(--paper); font-size: 21px; }

    .shelf {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      min-height: 30px;
      max-width: 110px;
    }

    .shelf button {
      min-width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(127, 216, 184, .5);
      border-radius: 9px;
      font-size: 24px;
      font-weight: 800;
      color: var(--jade);
      background: rgba(127, 216, 184, .08);
    }

    .field { position: relative; z-index: 2; flex: 1; min-width: 0; }

    .turn-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      padding: 6px 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(11, 11, 10, .85);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .1em;
      white-space: nowrap;
      transition: border-color 250ms ease, color 250ms ease;
    }

    .turn-banner.for-left { border-color: var(--led-red); color: var(--led-red); }
    .turn-banner.for-right { border-color: var(--led-gold); color: var(--led-gold); }
    .turn-banner.for-battle { border-color: var(--jade); color: var(--jade); }

    .tile {
      position: absolute;
      z-index: 5;
      display: grid;
      place-items: center;
      width: var(--tile);
      height: var(--tile);
      font-size: calc(var(--tile) * .68);
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      will-change: transform;
      transition: transform 700ms cubic-bezier(.25, .8, .35, 1);
    }

    .tile.from-left {
      color: var(--led-red);
      border: 1px solid rgba(255, 107, 82, .55);
      background: rgba(255, 107, 82, .1);
      text-shadow: 0 0 18px rgba(255, 107, 82, .8), 0 0 46px rgba(255, 107, 82, .35);
    }

    .tile.from-right {
      color: var(--led-gold);
      border: 1px solid rgba(255, 217, 138, .5);
      background: rgba(255, 217, 138, .08);
      text-shadow: 0 0 18px rgba(255, 217, 138, .8), 0 0 46px rgba(255, 217, 138, .35);
    }

    .tile.newborn {
      color: var(--jade);
      border: 1px solid rgba(127, 216, 184, .6);
      background: rgba(127, 216, 184, .12);
      text-shadow: 0 0 22px rgba(127, 216, 184, .9), 0 0 56px rgba(127, 216, 184, .4);
      animation: newborn-pop 500ms ease;
    }

    @keyframes newborn-pop {
      0% { scale: .2; }
      70% { scale: 1.45; }
      100% { scale: 1; }
    }

    .tile small {
      position: absolute;
      bottom: -16px;
      font-size: 11px;
      font-weight: 400;
      color: var(--jade);
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .tile i {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(11, 11, 10, .92);
      border: 1px solid currentColor;
      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      text-shadow: none;
    }

    .tile.wordborn {
      width: auto;
      min-width: var(--tile);
      padding: 0 12px;
      letter-spacing: .06em;
    }

    /* 偏旁拆解重組動畫 */
    .part-tile {
      position: absolute;
      z-index: 8;
      display: grid;
      place-items: center;
      width: var(--part);
      height: var(--part);
      font-size: calc(var(--part) * .68);
      font-weight: 800;
      color: var(--jade);
      text-shadow: 0 0 20px rgba(127, 216, 184, .95), 0 0 50px rgba(127, 216, 184, .4);
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 10px;
      background: rgba(11, 11, 10, .88);
      will-change: transform;
      transition: transform 1150ms cubic-bezier(.3, .9, .35, 1.1), opacity 350ms ease;
    }

    /* 新字講解卡 */
    .newchar-card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(620px, 94%);
      padding: 16px 20px;
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 18px;
      background: rgba(11, 11, 10, .95);
      backdrop-filter: blur(6px);
      animation: card-in 320ms ease;
    }

    .newchar-card .nc-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .14em;
      color: var(--led-gold);
    }

    .nc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
      width: 100%;
    }

    .nc-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid rgba(241, 238, 230, .12);
      border-radius: 14px;
    }

    .nc-head { display: flex; align-items: baseline; gap: 10px; }

    .nc-head b {
      font-size: 80px;
      font-weight: 800;
      color: var(--jade);
      text-shadow: 0 0 18px rgba(127, 216, 184, .6);
      line-height: 1.05;
    }

    .nc-head span { font-size: 26px; font-weight: 700; color: var(--led-gold); }

    .nc-words { font-size: 19px; color: var(--paper); letter-spacing: .04em; }

    .nc-sent {
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .nc-sent small { display: block; font-size: 11px; color: rgba(241, 238, 230, .38); }

    @media (max-width: 700px) {
      .nc-grid { grid-template-columns: 1fr; }
      .nc-head b { font-size: 58px; }
    }

    .swap-note {
      position: absolute;
      z-index: 9;
      transform: translateX(-50%);
      padding: 8px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 217, 138, .5);
      background: rgba(11, 11, 10, .92);
      color: var(--led-gold);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .08em;
      white-space: nowrap;
      pointer-events: none;
      animation: card-in 250ms ease;
    }

    .tile.is-wrong { animation: shake 400ms ease; border-color: var(--led-red) !important; }

    /* 第五關：部首賽跑 */
    .radical-arena {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
    }

    .radical-half {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      align-content: center;
      padding: 64px 18px 18px;
    }

    .radical-half.left { border-right: 1px dashed rgba(241, 238, 230, .22); }

    .radical-half button {
      min-height: 64px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 40px;
      font-weight: 800;
      background: rgba(255, 255, 255, .04);
      transition: transform 120ms ease, border-color 150ms ease, background 150ms ease;
    }

    .radical-half.left button { color: var(--led-red); }
    .radical-half.right button { color: var(--led-gold); }

    .radical-half button:active { transform: scale(.92); }

    .radical-half button.is-hit {
      border-color: var(--jade);
      background: rgba(127, 216, 184, .25);
      color: var(--jade);
    }

    .radical-half button.is-miss { animation: shake 400ms ease; border-color: var(--led-red); }

    .radical-half.is-penalty { opacity: .45; pointer-events: none; }

    .check-pop {
      position: absolute;
      z-index: 12;
      transform: translate(-50%, -50%);
      font-size: 96px;
      pointer-events: none;
      filter: drop-shadow(0 0 26px rgba(127, 216, 184, .85));
      animation: check-pop 1.1s ease forwards;
    }

    @keyframes check-pop {
      0% { opacity: 0; scale: .2; }
      30% { opacity: 1; scale: 1.35; }
      55% { scale: 1; }
      100% { opacity: 0; translate: 0 -50px; scale: 1.05; }
    }

    /* 第三關抽字按鈕 */
    .deal-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;
      display: none;
      padding: 22px 54px;
      border-radius: 999px;
      background: linear-gradient(160deg, #7fd8b8, #386c5b);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .12em;
      box-shadow: 0 10px 34px rgba(127, 216, 184, .35);
    }

    .deal-button.is-visible { display: block; }

    .deal-button:active { transform: translate(-50%, -50%) scale(.95); }

    /* 部件爆炸視圖 */
    .explode-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: rgba(11, 11, 10, .94);
      backdrop-filter: blur(8px);
      animation: card-in 250ms ease;
    }

    .ex-stage {
      position: relative;
      width: min(560px, 94vw);
      height: 310px;
      flex: none;
    }

    .ex-char {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 150px;
      font-weight: 800;
      line-height: 1;
      color: var(--led-gold);
      text-shadow: 0 0 30px rgba(255, 217, 138, .5);
      transition: opacity 800ms ease, transform 800ms ease;
    }

    .ex-char.is-ghost { opacity: .14; transform: translate(-50%, -50%) scale(1.2); }

    .ex-part {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: transform 950ms cubic-bezier(.3, .9, .35, 1.12), opacity 450ms ease 250ms;
    }

    .ex-part b {
      font-size: 96px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--jade);
      text-shadow: 0 0 24px rgba(127, 216, 184, .6);
    }

    .ex-part small {
      max-width: 190px;
      font-size: 16px;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }

    .ex-eg { display: flex; gap: 6px; }

    .ex-eg button {
      padding: 5px 14px;
      border: 1px solid rgba(255, 217, 138, .45);
      border-radius: 10px;
      font-size: 24px;
      font-weight: 700;
      color: var(--led-gold);
    }

    .ex-solo { font-size: 15px; color: var(--muted); letter-spacing: .06em; }

    .ex-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }

    .ex-meta .py { font-size: 21px; font-weight: 700; color: var(--jade); }

    .ex-close {
      padding: 10px 32px;
      border: 1px solid var(--coral);
      border-radius: 999px;
      background: rgba(227, 106, 76, .2);
      font-size: 15px;
      letter-spacing: .08em;
    }

    /* 相遇詳解卡 */
    .clash-card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: min(420px, 86%);
      max-width: 92%;
      padding: 14px 22px;
      border: 1px solid rgba(127, 216, 184, .5);
      border-radius: 18px;
      background: rgba(11, 11, 10, .94);
      backdrop-filter: blur(6px);
      animation: card-in 320ms ease;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translate(-50%, -46%) scale(.92); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .cc-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .cc-fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 110px;
    }

    .cc-fighter b {
      font-size: 74px;
      font-weight: 800;
      line-height: 1.1;
    }

    .cc-fighter small {
      font-size: 15px;
      color: var(--muted);
      white-space: nowrap;
    }

    .etym-link {
      margin-top: 4px;
      padding: 2px 10px;
      border: 1px solid rgba(122, 184, 255, .45);
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: .08em;
      color: var(--blue);
      text-decoration: none;
    }

    .evo-row {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }

    .evo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .evo-item b {
      font-size: 30px;
      font-weight: 400;
      color: var(--led-gold);
      line-height: 1.15;
    }

    .evo-item small {
      font-size: 9px;
      color: rgba(241, 238, 230, .42);
      letter-spacing: .12em;
    }

    .cc-vs {
      font-size: 15px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .1em;
    }

    .cc-verdict {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--jade);
      text-align: center;
    }

    .cc-result {
      font-size: 18px;
      color: var(--led-gold);
      letter-spacing: .06em;
      text-align: center;
    }

    .shelf button { width: auto; min-width: 28px; padding: 0 5px; }

    /* ---------- 遮罩 ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(11, 11, 10, .9);
      backdrop-filter: blur(6px);
    }

    .overlay.is-visible { display: flex; }

    .overlay h2 {
      font-size: clamp(22px, 5.5vmin, 36px);
      letter-spacing: .12em;
      color: var(--led-gold);
      text-shadow: 0 0 24px rgba(255, 217, 138, .4);
    }

    .overlay p { max-width: 520px; font-size: 13px; line-height: 1.9; color: var(--muted); }

    .overlay .demo {
      font-size: 25px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: .08em;
    }

    .overlay .demo b { color: var(--jade); }

    .cta {
      padding: 12px 36px;
      border-radius: 999px;
      background: linear-gradient(160deg, #ff7a54, #a83a28);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #fff;
      box-shadow: 0 10px 34px rgba(227, 106, 76, .4);
    }

    .cta:active { transform: scale(.96); }

    .won-chars { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 520px; }

    .won-chars button {
      padding: 5px 11px;
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 10px;
      font-size: 19px;
      font-weight: 800;
      color: var(--jade);
      background: rgba(127, 216, 184, .08);
    }

    /* ---------- 底欄 ---------- */
    .live {
      min-height: 24px;
      padding: 3px 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live b { color: var(--led-gold); font-weight: 600; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--ink-soft);
    }

    .mic {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(160deg, #ff7a54, #a83a28);
      box-shadow: 0 8px 26px rgba(227, 106, 76, .4);
      transition: transform 150ms ease, background 250ms ease;
    }

    .mic.for-right { background: linear-gradient(160deg, #ffd98a, #a5762c); }

    .mic:active { transform: scale(.94); }

    .mic[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; }

    .mic.is-listening::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid rgba(255, 122, 84, .8);
      border-radius: 50%;
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.92); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .typebox { display: flex; flex: 1; max-width: 300px; gap: 6px; }

    .typebox input {
      flex: 1;
      min-width: 0;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      color: var(--paper);
      font: inherit;
      font-size: 13px;

      ['马', '馬字旁'], ['鸟', '鳥字旁'], ['鱼', '魚字旁'], ['雨', '雨字頭'], ['竹', '竹字頭'],
      ['门', '門字框'], ['车', '車字旁'], ['弓', '弓字旁'], ['足', '足字旁'], ['目', '目字旁'],
      ['米', '米字旁'], ['禾', '禾木旁'], ['贝', '貝字旁'], ['王', '王字旁'], ['疒', '病字旁']
    ];

    // 一個字的部件（獨體字把自己當一個部件）
    function partsOf(char) {
      return PARTS.d[char] || [char];
    }

    function partsWhy(char) {
      if (PARTS.d[char]) {
        const [l, r] = PARTS.d[char];
        return {
          zht: `部件：${l} ＋ ${r}`,
          zhs: `部件：${l} ＋ ${r}`,
          en: `parts: ${l} + ${r}`
        };
      }
      return { zht: '獨體字', zhs: '独体字', en: 'single-component' };
    }

    // 用某個部件組成的例字（常用優先）
    let PART_EXAMPLES = null;

    function examplesWith(part, exclude) {
      if (!PART_EXAMPLES) {
        PART_EXAMPLES = {};
        Object.entries(PARTS.d).forEach(([char, [l, r]]) => {
          (PART_EXAMPLES[l] = PART_EXAMPLES[l] || []).push(char);
          if (r !== l) (PART_EXAMPLES[r] = PART_EXAMPLES[r] || []).push(char);
        });
        Object.values(PART_EXAMPLES).forEach(list =>
          list.sort((x, y) => (WORDS_OF[y] || []).length - (WORDS_OF[x] || []).length));
      }
      return (PART_EXAMPLES[part] || []).filter(c => !exclude.has(c)).slice(0, 3);
    }

    // 交叉鍛造：兩個字的部件互相搭配，能拼出哪些新字
    function crossForge(a, b) {
      const pa = partsOf(a);
      const pb = partsOf(b);
      const seen = new Set([a, b]);
      const results = [];
      for (const x of pa) {
        for (const y of pb) {
          for (const [l, r] of [[x, y], [y, x]]) {
            const made = PARTS.c[l + r];
            if (made && !seen.has(made)) {
              seen.add(made);
              results.push({ char: made, l, r });
            }
          }
        }
      }
      return results.slice(0, 4);
    }

    function wordOf(a, b) {
      if (WORD_SET.has(a + b)) return a + b;
      if (WORD_SET.has(b + a)) return b + a;
      return null;
    }

    // 每個字最常用的組詞（離線從全詞庫預計算）
    const WORDS_OF = window.CIYU_BY_CHAR || {};

    // 唐詩例句索引（懶載入：第一次用到才轉換）
    let POEM_LINES = null;

    function findPoemLine(char) {
      if (!POEM_LINES) {
        POEM_LINES = [];
        const convert = window.OpenCC ? window.OpenCC.Converter({ from: 't', to: 'cn' }) : (t => t);
        (window.TANGSHI_300 || []).forEach(poem => {
          const title = convert(poem.title || '');
          const author = convert(poem.author || '');
          poem.paragraphs.forEach(paragraph => {
            const simplified = convert(paragraph);
            paragraph.split(/[，。！？；：、\s]+/).forEach((clauseT, i) => {
              const clauseS = simplified.split(/[，。！？；：、\s]+/)[i] || '';
              if (clauseS.length >= 3 && clauseS.length <= 9) {
                POEM_LINES.push({ text: clauseS, textT: clauseT, title, author });
              }
            });
          });
        });
      }
      return POEM_LINES.find(line => line.text.includes(char)) || null;
    }

    // 新字講解：拼音 + 組詞 + 例句（唐詩優先，否則引導造句）
    function explainChar(char) {
      const pinyin = PARTS.p[char] || '';
      const words = (WORDS_OF[char] || []).slice(0, 3);
      const line = findPoemLine(char);
      return { char, pinyin, words, line };
    }

    // 交換偏旁：打(扌丁) + 江(氵工) -> 扛(扌工) + 汀(氵丁)
    function recombine(a, b) {
      const da = PARTS.d[a];
      const db = PARTS.d[b];
      if (!da || !db) return null;
      const n1 = PARTS.c[da[0] + db[1]];
      const n2 = PARTS.c[db[0] + da[1]];
      if (!n1 || !n2) return null;
      const before = new Set([a, b]);
      if (before.has(n1) && before.has(n2)) return null;
      return [n1, n2];
    }

    /* ---------- DOM ---------- */
    const field = document.getElementById('field');
    const turnBanner = document.getElementById('turnBanner');
    const liveLine = document.getElementById('liveLine');
    const micButton = document.getElementById('micButton');
    const typeForm = document.getElementById('typeForm');
    const typeInput = document.getElementById('typeInput');
    const dealButton = document.getElementById('dealButton');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');

    /* ---------- 遊戲狀態 ---------- */
    const game = {
      phase: 'idle',        // idle | listen | battle | over
      level: 1,             // 1 = 單字對決, 2 = 句子擂臺
      turn: 'L',
      starter: 'L',
      round: 1,
      hp: { L: 5, R: 5 },
      points: { L: 0, R: 0 },
      squads: { L: [], R: [] },   // 本回合的字 tile 物件
      newChars: [],
      idiomsDone: 0,
      listening: false
    };

    function maxChars() { return game.level === 1 ? 1 : 6; }

    function tileSize() {
      return Math.max(56, Math.min(92, Math.floor(field.clientWidth / 9)));
    }

    function setBanner(kind) {
      turnBanner.className = 'turn-banner';
      if (kind === 'L') { turnBanner.classList.add('for-left'); turnBanner.textContent = pageStrings[`turnLeft${game.level}`][language]; }
      else if (kind === 'R') { turnBanner.classList.add('for-right'); turnBanner.textContent = pageStrings[`turnRight${game.level}`][language]; }
      else { turnBanner.classList.add('for-battle'); turnBanner.textContent = pageStrings.battle[language]; }
      micButton.classList.toggle('for-right', kind === 'R');
    }

    function setLive(text, highlight) {
      liveLine.innerHTML = '';
      if (highlight) {
        const b = document.createElement('b');
        b.textContent = highlight;
        liveLine.append(text, b);
      } else {
        liveLine.textContent = text;
      }
    }

    function updateHud() {
      if ((game.phase === 'battle' || game.phase === 'listen')) {
        if (game.points.L >= 20) { endGame('L'); }
        else if (game.points.R >= 20) { endGame('R'); }
      }
      document.getElementById('hpL').textContent = '❤️'.repeat(game.hp.L) + '🖤'.repeat(5 - game.hp.L);
      document.getElementById('hpR').textContent = '❤️'.repeat(game.hp.R) + '🖤'.repeat(5 - game.hp.R);
      document.getElementById('pointsL').textContent = game.points.L;
      document.getElementById('pointsR').textContent = game.points.R;
      document.getElementById('roundCount').textContent = game.round;
    }

    /* ---------- Tile ---------- */
    function rowY(index, total) {
      const h = field.clientHeight;
      const size = tileSize();
      const top = h * 0.16;
      const usable = h * 0.62;
      if (total <= 1) return top + usable / 2 - size / 2;
      return top + (usable / (total - 1)) * index - size / 2 + (usable === 0 ? 0 : 0);
    }

    function makeTile(char, sideKey, index, total) {
      const size = tileSize();
      const el = document.createElement('div');
      el.className = `tile from-${sideKey === 'L' ? 'left' : 'right'}`;
      el.style.setProperty('--tile', `${size}px`);
      el.textContent = char;
      if (PARTS.d[char]) {
        const badge = document.createElement('i');
        badge.textContent = PARTS.d[char][0];
        badge.style.color = 'var(--jade)';
        el.append(badge);
      }
      const startX = sideKey === 'L' ? -size : field.clientWidth;
      el.style.transform = `translate(${startX}px, ${rowY(index, total)}px)`;
      field.append(el);
      el.addEventListener('pointerdown', () => explodeView(char));
      const tile = { char, el, side: sideKey, index, total, launched: false };
      // 進場：懸停在本方三分之一處（已出戰的字不再回頭）
      requestAnimationFrame(() => {
        if (tile.launched) return;
        const hoverX = sideKey === 'L' ? field.clientWidth * 0.24 : field.clientWidth * 0.76 - size;
        el.style.transform = `translate(${hoverX}px, ${rowY(index, total)}px)`;
      });
      return tile;
    }

    function moveTile(tile, x, y, ms) {
      tile.el.style.transitionDuration = `${ms}ms`;
      tile.el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function burstTile(tile) {
      const el = tile.el;
      const matrix = getComputedStyle(el).transform;
      const anim = el.animate(
        [
          { transform: `${matrix === 'none' ? '' : matrix} scale(1)`, opacity: 1 },
          { transform: `${matrix === 'none' ? '' : matrix} scale(1.8)`, opacity: 0 }
        ],
        { duration: 320, easing: 'ease-out' }
      );
      anim.onfinish = () => el.remove();
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    // 拆解講解動畫：字裂成部件，配含義說明泡
    async function splitExplain(tile, y, size, midX) {
      const char = tile.char;
      const parts = partsOf(char);
      const isLeftSide = tile.side === 'L';
      const partSize = Math.round(size * 0.7);
      const partY = y + (size - partSize) / 2;
      const baseX = isLeftSide ? midX - size * 0.56 : midX + size * 0.56;
      const meanings = parts.map(p => PART_MEANING[p] || '');

      const note = document.createElement('div');
      note.className = 'swap-note';
      note.textContent = parts.length === 2
        ? `${char} ＝ ${parts[0]} ＋ ${parts[1]}${meanings[0] ? `　·　${parts[0]}：${meanings[0]}` : ''}`
        : `${char}：獨體字，本身就是部件！`;
      note.style.left = `${midX + size / 2}px`;
      note.style.top = `${y + size * 1.25}px`;
      field.append(note);

      const narration = parts.length === 2
        ? speakText(`${char}：${parts[0]}、${parts[1]}。`
          + (meanings[0] ? `${parts[0]}，${meanings[0]}。` : '')
          + (meanings[1] ? `${parts[1]}，${meanings[1]}。` : ''))
        : speakText(`${char}，独体字。`);

      const pieces = [];
      if (parts.length === 2) {
        burstTile(tile);
        const spread = isLeftSide ? [-1.35, -0.55] : [0.55, 1.35];
        parts.forEach((p, i) => {
          const el = document.createElement('div');
          el.className = 'part-tile';
          el.style.setProperty('--part', `${partSize}px`);
          el.textContent = p;
          el.style.transform = `translate(${baseX}px, ${partY}px)`;
          field.append(el);
          requestAnimationFrame(() => {
            el.style.transform = `translate(${midX + size * spread[i]}px, ${partY}px) rotate(${i ? 360 : -360}deg)`;
          });
          pieces.push({ part: p, el });
        });
      } else {
        const x = midX + size * (isLeftSide ? -0.95 : 0.95);
        moveTile(tile, x, y, 600);
        pieces.push({ part: char, el: tile.el });
      }
      await Promise.all([narration, wait(2200)]);
      note.remove();
      return pieces;
    }

    // 鍛造動畫：兩個部件合體成新字
    async function forgeMerge(pieceL, pieceR, newChar, y, size, midX) {
      const partSize = Math.round(size * 0.7);
      const partY = y + (size - partSize) / 2;
      const clone = src => {
        const el = document.createElement('div');
        el.className = 'part-tile';
        el.style.setProperty('--part', `${partSize}px`);
        el.textContent = src.part;
        el.style.transform = src.el.style.transform.replace(/ rotate\([^)]*\)/, '');
        field.append(el);
        return el;
      };
      const c1 = clone(pieceL);
      const c2 = clone(pieceR);
      const note = document.createElement('div');
      note.className = 'swap-note';
      note.textContent = `${pieceL.part} ＋ ${pieceR.part} ＝ ${newChar}`;
      note.style.left = `${midX + size / 2}px`;
      note.style.top = `${y + size * 1.25}px`;
      field.append(note);
      requestAnimationFrame(() => {
        c1.style.transform = `translate(${midX - partSize * 0.45}px, ${partY}px)`;
        c2.style.transform = `translate(${midX + partSize * 0.45}px, ${partY}px)`;
      });
      await wait(1400);
      c1.style.opacity = '0';
      c2.style.opacity = '0';
      await wait(300);
      c1.remove();
      c2.remove();
      setTimeout(() => note.remove(), 1400);
    }

    /* 部件爆炸視圖：點任何字都能拆開看 */
    function explodeView(char) {
      document.querySelector('.explode-modal')?.remove();
      const modal = document.createElement('div');
      modal.className = 'explode-modal';

      const stage = document.createElement('div');
      stage.className = 'ex-stage';
      const big = document.createElement('div');
      big.className = 'ex-char';
      big.textContent = char;
      stage.append(big);
      modal.append(stage);

      const meta = document.createElement('div');
      meta.className = 'ex-meta';
      if (PARTS.p[char]) {
        const py = document.createElement('span');
        py.className = 'py';
        py.textContent = PARTS.p[char];
        meta.append(py);
      }
      meta.append(evoRow(char));
      const etym = document.createElement('a');
      etym.className = 'etym-link';
      etym.href = `https://hanziyuan.net/#${encodeURIComponent(char)}`;
      etym.target = '_blank';
      etym.rel = 'noreferrer';
      etym.textContent = '字源 ↗';
      meta.append(etym);
      modal.append(meta);

      const parts = PARTS.d[char];
      let speech;
      if (parts) {
        const exclude = new Set([char]);
        speech = `${char}：${parts[0]}、${parts[1]}。`;
        parts.forEach((p, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'ex-part';
          const glyph = document.createElement('b');
          glyph.textContent = p;
          const label = document.createElement('small');
          const meaning = PART_MEANING[p] || '';
          label.textContent = meaning || (PARTS.p[p] ? `讀 ${PARTS.p[p]}` : '');
          const eg = document.createElement('div');
          eg.className = 'ex-eg';
          const examples = examplesWith(p, exclude);
          examples.forEach(egChar => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.textContent = egChar;
            chip.addEventListener('click', ev => { ev.stopPropagation(); explodeView(egChar); });
            eg.append(chip);
          });
          wrap.append(glyph, label, eg);
          stage.append(wrap);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            big.classList.add('is-ghost');
            wrap.style.opacity = '1';
            wrap.style.transform = `translate(-50%, -50%) translateX(${i === 0 ? -135 : 135}px)`;
          }));
          if (meaning) speech += `${p}，${meaning}。`;
          if (examples.length) speech += `例字：${examples.join('，')}。`;
        });
      } else {
        const solo = document.createElement('div');
        solo.className = 'ex-solo';
        solo.textContent = { zht: '獨體字，拆不開啦！它自己就是部件。', zhs: '独体字，拆不开啦！它自己就是部件。', en: 'A single-component character—nothing to split!' }[language];
        modal.append(solo);
        speech = `${char}，独体字。`;
      }

      const close = document.createElement('button');
      close.className = 'ex-close';
      close.textContent = { zht: '知道啦！', zhs: '知道啦！', en: 'Got it!' }[language];
      close.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', event => { if (event.target === modal) modal.remove(); });
      modal.append(close);
      document.body.append(modal);
      speakText(speech);
    }

    async function comboSwapLegacy(a, b, n1, n2, y, size, midX) {
      const [l1, r1] = PARTS.d[a.char];
      const [l2, r2] = PARTS.d[b.char];
      const partSize = Math.round(size * 0.66);
      const partY = y + (size - partSize) / 2;

      const makePart = (ch, x) => {
        const el = document.createElement('div');
        el.className = 'part-tile';
        el.style.setProperty('--part', `${partSize}px`);
        el.textContent = ch;
        el.style.transform = `translate(${x}px, ${partY}px)`;
        field.append(el);
        return el;
      };

      // 四個部件先出現在原字位置
      const aX = midX - size * 0.56;
      const bX = midX + size * 0.56;
      burstTile(a);
      burstTile(b);
      const p1 = makePart(l1, aX);
      const p2 = makePart(r1, aX);
      const p3 = makePart(l2, bX);
      const p4 = makePart(r2, bX);
      await wait(80);

      // 散開成兩組
      const g1L = midX - size * 1.3;
      const g1R = midX - size * 0.55;
      const g2L = midX + size * 0.55;
      const g2R = midX + size * 1.3;
      p1.style.transform = `translate(${g1L}px, ${partY}px)`;
      p2.style.transform = `translate(${g1R}px, ${partY}px)`;
      p3.style.transform = `translate(${g2L}px, ${partY}px)`;
      p4.style.transform = `translate(${g2R}px, ${partY}px)`;
      await wait(1400);

      // 右偏旁互換（轉一圈慢慢飛過去）
      const note = document.createElement('div');
      note.className = 'swap-note';
      note.textContent = `${l1}+${r2}=${n1} · ${l2}+${r1}=${n2}`;
      note.style.left = `${midX + size / 2}px`;
      note.style.top = `${y + size * 1.25}px`;
      field.append(note);
      p2.style.transform = `translate(${g2R}px, ${partY}px) rotate(360deg)`;
      p4.style.transform = `translate(${g1R}px, ${partY}px) rotate(-360deg)`;
      await wait(1600);

      // 各組合體成新字
      p1.style.transform = `translate(${(g1L + g1R) / 2}px, ${partY}px)`;
      p4.style.transform = `translate(${(g1L + g1R) / 2}px, ${partY}px) rotate(-360deg)`;
      p3.style.transform = `translate(${(g2L + g2R) / 2}px, ${partY}px)`;
      p2.style.transform = `translate(${(g2L + g2R) / 2}px, ${partY}px) rotate(360deg)`;
      await wait(700);
      [p1, p2, p3, p4].forEach(p => { p.style.opacity = '0'; });
      await wait(300);
      [p1, p2, p3, p4].forEach(p => p.remove());
      setTimeout(() => note.remove(), 2200);
    }

    // 新字講解卡：拼音 + 組詞 + 例句
    async function showNewCharCard(chars, holdMs = 9000) {
      const card = document.createElement('div');
      card.className = 'newchar-card';
      const title = document.createElement('div');
      title.className = 'nc-title';
      title.textContent = { zht: '✨ 變出新字！', zhs: '✨ 变出新字！', en: '✨ New characters!' }[language];
      const grid = document.createElement('div');
      grid.className = 'nc-grid';

      const speakParts = [];
      chars.forEach(char => {
        const info = explainChar(char);
        const item = document.createElement('div');
        item.className = 'nc-item';
        const head = document.createElement('div');
        head.className = 'nc-head';
        const big = document.createElement('b');
        big.textContent = char;
        const py = document.createElement('span');
        py.textContent = info.pinyin;
        head.append(big, py);
        const etym = document.createElement('a');
        etym.className = 'etym-link';
        etym.href = `https://hanziyuan.net/#${encodeURIComponent(char)}`;
        etym.target = '_blank';
        etym.rel = 'noreferrer';
        etym.textContent = { zht: '字源：甲骨文·金文 ↗', zhs: '字源：甲骨文·金文 ↗', en: 'Etymology ↗' }[language];
        item.append(head, evoRow(char), etym);
        if (info.words.length) {
          const words = document.createElement('div');
          words.className = 'nc-words';
          words.textContent = { zht: '組詞：', zhs: '组词：', en: 'Words: ' }[language] + info.words.join(' · ');
          item.append(words);
        }
        const sent = document.createElement('div');
        sent.className = 'nc-sent';
        if (info.line) {
          sent.textContent = language === 'zht' ? info.line.textT : info.line.text;
          const source = document.createElement('small');
          source.textContent = `${info.line.author}《${info.line.title}》`;
          sent.append(source);
        } else if (info.words.length) {
          sent.textContent = {
            zht: `試著用「${info.words[0]}」說一句話吧！`,
            zhs: `试着用“${info.words[0]}”说一句话吧！`,
            en: `Try saying a sentence with "${info.words[0]}"!`
          }[language];
        }
        item.append(sent);
        item.addEventListener('pointerdown', () => explodeView(char));
        grid.append(item);

        const d = PARTS.d[char];
        let line = d ? `${char}：${d[0]}加${d[1]}` : `${char}`;
        if (info.words.length) line += `。组词：${info.words.join('、')}`;
        speakParts.push(line);
      });

      card.append(title, grid);
      field.append(card);
      await Promise.all([speakText(`${speakParts.join('。')}。`), wait(holdMs)]);
      card.remove();
    }

    /* 篆體字體（崇羲篆體，中研院小學堂，CC BY-ND，原樣轉發）背景載入 */
    let sealReady = false;
    if (window.FontFace && document.fonts) {
      const sealFont = new FontFace('ChongXi Seal', "url('assets/chongxi_seal.otf')", { display: 'swap' });
      sealFont.load().then(loaded => {
        document.fonts.add(loaded);
        sealReady = true;
      }).catch(() => {});
    }

    const EVO_STAGES = [
      { key: 'seal', label: { zht: '小篆', zhs: '小篆', en: 'SEAL' }, family: "'ChongXi Seal', serif" },
      { key: 'kai', label: { zht: '楷書', zhs: '楷书', en: 'KAI' }, family: "'Kaiti SC', 'Kaiti TC', 'STKaiti', 'DFKai-SB', 'BiauKai', serif" },
      { key: 'xing', label: { zht: '行草', zhs: '行草', en: 'CURSIVE' }, family: "'Xingkai SC', 'Xingkai TC', 'STXingkai', 'Kaiti SC', cursive" }
    ];

    // 字形演變列：小篆 → 楷書 → 行草
    function evoRow(char) {
      const row = document.createElement('div');
      row.className = 'evo-row';
      EVO_STAGES.forEach(stage => {
        if (stage.key === 'seal' && !sealReady) return;
        const item = document.createElement('div');
        item.className = 'evo-item';
        const glyph = document.createElement('b');
        glyph.textContent = char;
        glyph.style.fontFamily = stage.family;
        const label = document.createElement('small');
        label.textContent = stage.label[language];
        item.append(glyph, label);
        row.append(item);
      });
      return row;
    }

    // 相遇詳解卡：兩個字的五行由來 + 生剋判定 + 結果
    async function showClash(aTile, bTile, verdictText, resultText, holdMs = 4200) {
      const card = document.createElement('div');
      card.className = 'clash-card';
      const row = document.createElement('div');
      row.className = 'cc-row';
      [aTile, bTile].forEach((tile, i) => {
        if (i === 1) {
          const vs = document.createElement('div');
          vs.className = 'cc-vs';
          vs.textContent = 'VS';
          row.append(vs);
        }
        const fighter = document.createElement('div');
        fighter.className = 'cc-fighter';
        const big = document.createElement('b');
        big.textContent = tile.char;
        big.style.color = 'var(--led-gold)';
        const why = document.createElement('small');
        why.textContent = partsWhy(tile.char)[language];
        const etym = document.createElement('a');
        etym.className = 'etym-link';
        etym.href = `https://hanziyuan.net/#${encodeURIComponent(tile.char)}`;
        etym.target = '_blank';
        etym.rel = 'noreferrer';
        etym.textContent = { zht: '字源：甲骨文·金文 ↗', zhs: '字源：甲骨文·金文 ↗', en: 'Etymology ↗' }[language];
        fighter.append(big, why, evoRow(tile.char), etym);
        row.append(fighter);
      });
      const verdict = document.createElement('div');
      verdict.className = 'cc-verdict';
      verdict.textContent = verdictText;
      const result = document.createElement('div');
      result.className = 'cc-result';
      result.textContent = resultText;
      card.append(row, verdict, result);
      field.append(card);
      await wait(holdMs);
      card.remove();
    }

    /* ---------- 回合流程 ---------- */
    function beginTurn(sideKey) {
      game.phase = 'listen';
      game.turn = sideKey;
      setBanner(sideKey);
      setLive('');
      dealButton.classList.toggle('is-visible', game.level === 3);
    }

    // 第三關：構造式抽取——每一對都保證能交叉鍛造出新字
    function drawForgeablePairs(count) {
      const bank = window.XINGSHENG_3000 || '';
      const used = new Set();
      const pairs = [];
      let guard = 0;
      while (pairs.length < count && guard < 4000) {
        guard += 1;
        const a = bank[Math.floor(Math.random() * bank.length)];
        if (!a || used.has(a) || !PARTS.d[a]) continue;
        let partner = null;
        for (let attempt = 0; attempt < 150 && !partner; attempt += 1) {
          const b = bank[Math.floor(Math.random() * bank.length)];
          if (!b || b === a || used.has(b)) continue;
          if (crossForge(a, b).length) partner = b;
        }
        if (!partner) continue;
        used.add(a);
        used.add(partner);
        pairs.push([a, partner]);
      }
      return pairs;
    }

    /* ---------- 第五關：部首賽跑 ---------- */
    const radicalGame = { set: [], targets: [], round: 0, locked: true, arena: null, buttons: { L: [], R: [] } };

    function radicalCleanup() {
      if (radicalGame.arena) { radicalGame.arena.remove(); radicalGame.arena = null; }
      radicalGame.buttons = { L: [], R: [] };
      radicalGame.locked = true;
    }

    function radicalStart() {
      radicalCleanup();
      const pool = [...RADICAL_CALLS].sort(() => Math.random() - 0.5);
      radicalGame.set = pool.slice(0, 12);
      radicalGame.targets = [...radicalGame.set].sort(() => Math.random() - 0.5).slice(0, 10);
      radicalGame.round = 0;

      const arena = document.createElement('div');
      arena.className = 'radical-arena';
      ['L', 'R'].forEach(sideKey => {
        const half = document.createElement('div');
        half.className = `radical-half ${sideKey === 'L' ? 'left' : 'right'}`;
        [...radicalGame.set].sort(() => Math.random() - 0.5).forEach(([r]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = r;
          btn.addEventListener('pointerdown', () => radicalTap(sideKey, r, btn, half));
          half.append(btn);
          radicalGame.buttons[sideKey].push(btn);
        });
        arena.append(half);
      });
      field.append(arena);
      radicalGame.arena = arena;
      radicalNext();
    }

    async function radicalNext() {
      if (game.level !== 5 || game.phase === 'over') return;
      if (radicalGame.round >= radicalGame.targets.length) {
        endGame(game.points.L >= game.points.R ? 'L' : 'R');
        return;
      }
      const [, name] = radicalGame.targets[radicalGame.round];
      turnBanner.className = 'turn-banner for-battle';
      turnBanner.textContent = `第 ${radicalGame.round + 1}/10 題 · ${name}`;
      radicalGame.buttons.L.concat(radicalGame.buttons.R).forEach(b => b.classList.remove('is-hit'));
      await speakText(`${name}！`);
      radicalGame.locked = false;
    }

    function radicalTap(sideKey, r, btn, half) {
      if (radicalGame.locked || game.phase === 'over') return;
      const [target, name] = radicalGame.targets[radicalGame.round];
      if (r === target) {
        radicalGame.locked = true;
        btn.classList.add('is-hit');
        // ✅ 答對動畫
        const fieldRect = field.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();
        const check = document.createElement('div');
        check.className = 'check-pop';
        check.textContent = '✅';
        check.style.left = `${btnRect.left - fieldRect.left + btnRect.width / 2}px`;
        check.style.top = `${btnRect.top - fieldRect.top + btnRect.height / 2}px`;
        field.append(check);
        setTimeout(() => check.remove(), 1200);
        game.points[sideKey] += 1;
        updateHud();
        radicalGame.round += 1;
        speakText(sideKey === 'L' ? '红龙队得分！' : '金虎队得分！');
        setTimeout(radicalNext, 1400);
      } else {
        // 點錯：本方冷卻，防止亂拍
        btn.classList.add('is-miss');
        half.classList.add('is-penalty');
        setTimeout(() => {
          btn.classList.remove('is-miss');
          half.classList.remove('is-penalty');
        }, 900);
      }
    }

    /* ---------- 第四關：成語快點（雙隊競速） ---------- */
    const idiomGame = {
      tiles: { L: [], R: [] },
      raf: null,
      next: { L: 0, R: 0 },
      penalty: { L: false, R: false },
      entry: null,
      running: false,
      round: 0,
      divider: null
    };

    const IDIOM_ROUNDS = 10;

    function idiomDots(n, total) {
      return '●'.repeat(n) + '○'.repeat(Math.max(0, total - n));
    }

    function idiomBanner() {
      const entry = idiomGame.entry;
      if (!entry) return;
      const len = entry.w.length;
      turnBanner.className = 'turn-banner for-battle';
      turnBanner.innerHTML =
        `第 ${Math.min(idiomGame.round + 1, IDIOM_ROUNDS)}/${IDIOM_ROUNDS} · ${entry.w}` +
        ` <span style="color:var(--led-red)">${idiomDots(idiomGame.next.L, len)}</span>` +
        ` <span style="color:var(--led-gold)">${idiomDots(idiomGame.next.R, len)}</span>`;
    }

    function clearIdiomTiles() {
      if (idiomGame.raf) cancelAnimationFrame(idiomGame.raf);
      idiomGame.raf = null;
      idiomGame.tiles.L.concat(idiomGame.tiles.R).forEach(t => t.el.remove());
      idiomGame.tiles = { L: [], R: [] };
      if (idiomGame.divider) { idiomGame.divider.remove(); idiomGame.divider = null; }
    }

    async function idiomRound() {
      if (game.level !== 4 || game.phase === 'over') return;
      if (idiomGame.round >= IDIOM_ROUNDS) {
        endGame(game.points.L >= game.points.R ? 'L' : 'R');
        return;
      }
      game.phase = 'battle';
      const bank = window.CHENGYU_1000 || [];
      const entry = bank[Math.floor(Math.random() * bank.length)];
      idiomGame.entry = entry;
      idiomGame.next = { L: 0, R: 0 };
      idiomGame.penalty = { L: false, R: false };
      idiomBanner();
      // ① 先報成語
      await speakText(`${entry.w}！`);
      if (game.level !== 4 || game.phase === 'over') return;
      idiomGame.running = true;

      // 中線
      const divider = document.createElement('div');
      divider.style.cssText = 'position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed rgba(241,238,230,.22);z-index:3;';
      field.append(divider);
      idiomGame.divider = divider;

      // ② 同一套亂序方案鏡像鋪到兩個半場：同成語、同速度、同布局，看誰先按順序點完
      const size = tileSize();
      const halfW = field.clientWidth / 2;
      const colW = halfW / 4;
      const chars = [...entry.w];
      const spawnOrder = chars.map((_, i) => i).sort(() => Math.random() - 0.5); // 打亂出場順序
      const lanePerm = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      const speed = field.clientHeight / 7.5; // 加快掉落

      spawnOrder.forEach((charIdx, k) => {
        ['L', 'R'].forEach(sideKey => {
          const el = document.createElement('div');
          el.className = `tile ${sideKey === 'L' ? 'from-left' : 'from-right'}`;
          el.style.setProperty('--tile', `${size}px`);
          el.textContent = chars[charIdx];
          const baseX = sideKey === 'L' ? 0 : halfW;
          const x = baseX + lanePerm[k] * colW + (colW - size) / 2;
          const y = -size - k * size * 1.25;
          el.style.transform = `translate(${x}px, ${y}px)`;
          field.append(el);
          const tile = { char: chars[charIdx], el, x, y, done: false };
          el.addEventListener('pointerdown', () => idiomTap(sideKey, tile));
          idiomGame.tiles[sideKey].push(tile);
        });
      });

      let last = performance.now();
      const step = now => {
        const dt = Math.min(50, now - last) / 1000;
        last = now;
        let landed = false;
        idiomGame.tiles.L.concat(idiomGame.tiles.R).forEach(tile => {
          if (tile.done) return;
          tile.y += speed * dt;
          tile.el.style.transform = `translate(${tile.x}px, ${tile.y}px)`;
          if (tile.y > field.clientHeight - size) landed = true;
        });
        if (landed) { idiomMiss(); return; }
        if (idiomGame.running) idiomGame.raf = requestAnimationFrame(step);
      };
      idiomGame.raf = requestAnimationFrame(step);
    }

    function idiomTap(sideKey, tile) {
      if (!idiomGame.running || tile.done || idiomGame.penalty[sideKey]) return;
      const word = idiomGame.entry.w;
      if (tile.char === word[idiomGame.next[sideKey]]) {
        tile.done = true;
        const charLine = speakText(tile.char);
        burstTile(tile);
        idiomGame.next[sideKey] += 1;
        idiomBanner();
        if (idiomGame.next[sideKey] >= word.length) idiomWin(sideKey, charLine);
      } else {
        // 點錯：本隊冷卻 0.8 秒，防止亂拍試出順序
        tile.el.classList.add('is-wrong');
        idiomGame.penalty[sideKey] = true;
        setTimeout(() => {
          tile.el.classList.remove('is-wrong');
          idiomGame.penalty[sideKey] = false;
        }, 800);
      }
    }

    async function idiomWin(sideKey, lastCharLine) {
      idiomGame.running = false;
      clearIdiomTiles();
      idiomGame.round += 1;
      game.points[sideKey] += 1;
      updateHud();
      const e = idiomGame.entry;
      if (lastCharLine) await lastCharLine; // 先讓最後一個字讀完
      await speakText(`${sideKey === 'L' ? '红龙队' : '金虎队'}赢啦！${e.w}！${e.e || ''}`);
      if (game.level === 4 && game.phase !== 'over') setTimeout(idiomRound, 700);
    }

    async function idiomMiss() {
      idiomGame.running = false;
      clearIdiomTiles();
      idiomGame.round += 1;
      const e = idiomGame.entry;
      await speakText(`是${e.w}。`);
      if (game.level === 4 && game.phase !== 'over') setTimeout(idiomRound, 700);
    }

    function dealRound() {
      if (game.phase !== 'listen' || game.level !== 3) return;
      dealButton.classList.remove('is-visible');
      if (game.listening) stopListening();
      const dealt = drawForgeablePairs(6);
      game.dealtPairs = dealt;
      game.squads.L = dealt.map(([a], i) => makeTile(a, 'L', i, dealt.length));
      game.squads.R = dealt.map(([, b], i) => makeTile(b, 'R', i, dealt.length));
      resolveBattle();
    }

    function acceptSentence(text) {
      if (game.phase !== 'listen' || game.level >= 3) return;
      const chars = [...text].filter(c => HAN.test(c)).slice(0, maxChars());
      if (!chars.length) return;
      const sideKey = game.turn;
      game.squads[sideKey] = chars.map((char, i) => makeTile(char, sideKey, i, chars.length));
      if (game.listening) stopListening();
      if (sideKey === game.starter) {
        beginTurn(sideKey === 'L' ? 'R' : 'L');
      } else {
        resolveBattle();
      }
    }

    async function resolveBattle() {
      game.phase = 'battle';
      setBanner('battle');
      const size = tileSize();
      const midX = field.clientWidth / 2 - size / 2;
      const L = game.squads.L;
      const R = game.squads.R;

      let pairs = [];
      let restL = [];
      let restR = [];
      if (game.level === 3 && game.dealtPairs && L.length === R.length) {
        // 第三關：按抽定配對上場，每對保證能鍛造
        pairs = L.map((tileL, i) => [tileL, R[i]]);
      } else {
        // 智能配對：先把能拼新字的字配到一起，其次能組詞的，剩下按順序
        const usedL = new Set();
        const usedR = new Set();
        [
          (x, z) => crossForge(x, z).length > 0,
          (x, z) => wordOf(x, z)
        ].forEach(match => {
          L.forEach((tileL, i) => {
            if (usedL.has(i)) return;
            for (let j = 0; j < R.length; j += 1) {
              if (usedR.has(j)) continue;
              if (match(tileL.char, R[j].char)) {
                pairs.push([tileL, R[j]]);
                usedL.add(i);
                usedR.add(j);
                return;
              }
            }
          });
        });
        restL = L.filter((_, i) => !usedL.has(i));
        restR = R.filter((_, j) => !usedR.has(j));
        const restCount = Math.min(restL.length, restR.length);
        for (let k = 0; k < restCount; k += 1) pairs.push([restL[k], restR[k]]);
      }
      const pairCount = pairs.length;

      for (let i = 0; i < pairCount; i += 1) {
        if (game.phase !== 'battle') return;
        const [a, b] = pairs[i];
        const y = rowY(i, pairCount);
        a.launched = true;
        b.launched = true;
        moveTile(a, midX - size * 0.56, y, 650);
        moveTile(b, midX + size * 0.56, y, 650);
        await wait(700);

        // ① 先逐字拆解講解（部件飛散 + 含義）
        const piecesA = await splitExplain(a, y, size, midX);
        if (game.phase !== 'battle') return;
        const piecesB = await splitExplain(b, y, size, midX);
        if (game.phase !== 'battle') return;

        const word = wordOf(a.char, b.char);
        const news = crossForge(a.char, b.char);
        const allPieces = [...piecesA, ...piecesB];

        const clearPieces = () => {
          allPieces.forEach(piece => {
            piece.el.style.opacity = '0';
            setTimeout(() => piece.el.remove(), 400);
          });
        };

        if (news.length) {
          // ② 部件交叉鍛造：每拼出一個新字都完整演一遍
          for (const forged of news) {
            if (game.phase !== 'battle') return;
            const pieceL = allPieces.find(p => p.part === forged.l) || piecesA[0];
            const pieceR = allPieces.find(p => p.part === forged.r && p !== pieceL) || piecesB[0];
            const forgeLine = speakText(`${forged.l}，加${forged.r}：${forged.char}！`);
            await forgeMerge(pieceL, pieceR, forged.char, y, size, midX);
            await forgeLine;
            const owner = piecesA.some(p => p.part === forged.l) ? a.side : b.side;
            spawnNewChar(forged.char, owner, y);
            game.points[owner] += 2;
            game.newChars.push(forged.char);
            updateHud();
            await wait(700);
          }
          clearPieces();
          await showNewCharCard(news.map(n => n.char), game.level === 1 ? 5000 : 4200);
        } else if (word) {
          // ② 拼不出新字，但正好組成詞語：結盟
          const wordLine = speakText(`组词：${word}！`);
          await showClash(a, b, pageStrings.verdictAlly[language], pageStrings.resultWord[language](word));
          await wordLine;
          clearPieces();
          spawnNewChar(word, 'L', y);
          spawnNewChar(word, 'R', y);
          game.points.L += 2;
          game.points.R += 2;
          game.newChars.push(word);
          updateHud();
          await wait(1400);
        } else {
          // ② 什麼也拼不出：同歸於盡
          await showClash(a, b, pageStrings.verdictForge[language], pageStrings.resultTie[language]);
          clearPieces();
          await wait(500);
        }
        if (game.phase === 'over') return;
      }

      // 多出來的字直衝對方
      const extrasCount = Math.min(restL.length, restR.length);
      const extras = restL.length > restR.length ? restL.slice(extrasCount) : restR.slice(extrasCount);
      for (const tile of extras) {
        if (game.phase !== 'battle') return;
        tile.launched = true;
        const targetX = tile.side === 'L' ? field.clientWidth - size * 0.3 : -size * 0.7;
        moveTile(tile, targetX, rowY(tile.index, tile.total), 500);
        await wait(520);
        burstTile(tile);
        hitPlayer(tile.side === 'L' ? 'R' : 'L');
        game.points[tile.side] += 1;
        if (game.phase === 'over') return;
        await wait(300);
      }

      game.squads = { L: [], R: [] };
      game.round += 1;
      game.starter = game.starter === 'L' ? 'R' : 'L';
      updateHud();
      await wait(600);
      if (game.phase === 'battle') beginTurn(game.starter);
    }

    function spawnNewChar(char, sideKey, y) {
      const size = tileSize();
      const el = document.createElement('div');
      el.className = 'tile newborn';
      if (char.length > 1) el.classList.add('wordborn');
      el.style.setProperty('--tile', `${size}px`);
      el.textContent = char;
      const pinyin = char.length > 1
        ? [...char].map(c => PARTS.p[c] || '').join(' ').trim()
        : PARTS.p[char];
      if (pinyin) {
        const small = document.createElement('small');
        small.textContent = pinyin;
        el.append(small);
      }
      const midX = field.clientWidth / 2 - size / 2;
      el.style.transform = `translate(${midX + (sideKey === 'L' ? -size * 0.7 : size * 0.7)}px, ${y}px)`;
      field.append(el);
      el.addEventListener('pointerdown', () => explodeView(char));
      // 飛向自己的戰利品架
      setTimeout(() => {
        el.style.transitionDuration = '800ms';
        const targetX = sideKey === 'L' ? -size : field.clientWidth + size;
        el.style.transform = `translate(${targetX}px, ${field.clientHeight * 0.55}px) scale(.4)`;
      }, 1000);
      setTimeout(() => {
        el.remove();
        addToShelf(char, sideKey);
      }, 1800);
    }

    function addToShelf(char, sideKey) {
      const shelf = document.getElementById(sideKey === 'L' ? 'shelfL' : 'shelfR');
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = char;
      chip.title = PARTS.p[char] || '';
      chip.addEventListener('click', () => explodeView(char));
      shelf.append(chip);
    }

    function hitPlayer(sideKey) {
      game.hp[sideKey] = Math.max(0, game.hp[sideKey] - 1);
      const face = document.getElementById(sideKey === 'L' ? 'faceL' : 'faceR');
      face.classList.add('is-hit');
      setTimeout(() => face.classList.remove('is-hit'), 450);
      updateHud();
      if (game.hp[sideKey] === 0) endGame(sideKey === 'L' ? 'R' : 'L');
    }

    /* ---------- 開始 / 結束 ---------- */
    function resetGame() {
      field.querySelectorAll('.tile').forEach(el => el.remove());
      document.getElementById('shelfL').innerHTML = '';
      document.getElementById('shelfR').innerHTML = '';
      game.hp = { L: 5, R: 5 };
      game.points = { L: 0, R: 0 };
      game.squads = { L: [], R: [] };
      game.newChars = [];
      game.dealtPairs = null;
      game.idiomsDone = 0;
      clearIdiomTiles();
      idiomGame.running = false;
      idiomGame.round = 0;
      radicalCleanup();
      game.round = 1;
      game.starter = 'L';
      updateHud();
    }

    function startGame() {
      resetGame();
      if (game.level === 4 || game.level === 5) {
        game.phase = 'battle'; // 清掉上一局的 over 狀態，否則回合函數直接返回
        typeInput.placeholder = pageStrings[`typePlaceholder${game.level}`][language];
        startOverlay.classList.remove('is-visible');
        endOverlay.classList.remove('is-visible');
        if (game.level === 4) idiomRound();
        else radicalStart();
        return;
      }
      typeInput.placeholder = pageStrings[`typePlaceholder${game.level}`][language];
      startOverlay.classList.remove('is-visible');
      endOverlay.classList.remove('is-visible');
      beginTurn(game.starter);
    }

    function endGame(winner) {
      game.phase = 'over';
      idiomGame.running = false;
      clearIdiomTiles();
      radicalCleanup();
      if (game.listening) stopListening();
      document.getElementById('winnerTitle').textContent = (game.level === 4 || game.level === 5)
        ? pageStrings.radicalWin[language](game.points.L, game.points.R)
        : (winner === 'L' ? pageStrings.winLeft[language] : pageStrings.winRight[language]);
      document.getElementById('endStats').textContent =
        pageStrings.statsTemplate[language]({ rounds: game.round, newChars: game.newChars.length });
      const box = document.getElementById('wonChars');
      box.innerHTML = '';
      [...new Set(game.newChars)].slice(0, 30).forEach(char => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.textContent = char;
        chip.addEventListener('click', () => speakText(char));
        box.append(chip);
      });
      document.getElementById('retryButton').textContent =
        (game.level === 1 ? pageStrings.nextLevel
          : game.level === 2 ? pageStrings.nextLevel3
          : game.level === 3 ? pageStrings.nextLevel4
          : game.level === 4 ? pageStrings.nextLevel5
          : pageStrings.again)[language];
      endOverlay.classList.add('is-visible');
    }

    document.getElementById('startL1').addEventListener('click', () => { unlockTTS(); game.level = 1; startGame(); });
    document.getElementById('startL2').addEventListener('click', () => { unlockTTS(); game.level = 2; startGame(); });
    document.getElementById('startL3').addEventListener('click', () => { unlockTTS(); game.level = 3; startGame(); });
    document.getElementById('startL4').addEventListener('click', () => { unlockTTS(); game.level = 4; startGame(); });
    document.getElementById('startL5').addEventListener('click', () => { unlockTTS(); game.level = 5; startGame(); });

    // ☰ 關卡菜單：隨時回到選關頁
    document.getElementById('menuLevels').addEventListener('click', () => {
      game.phase = 'idle';
      if (game.listening) stopListening();
      idiomGame.running = false;
      clearIdiomTiles();
      radicalCleanup();
      window.NeuralTTS?.stop();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      game.squads = { L: [], R: [] };
      field.querySelectorAll('.tile, .part-tile, .clash-card, .newchar-card, .swap-note').forEach(el => el.remove());
      dealButton.classList.remove('is-visible');
      endOverlay.classList.remove('is-visible');
      startOverlay.classList.add('is-visible');
    });
    document.getElementById('dealButton').addEventListener('click', () => { unlockTTS(); dealRound(); });
    document.getElementById('retryButton').addEventListener('click', () => {
      unlockTTS();
      if (game.level === 1) game.level = 2;
      else if (game.level === 2) game.level = 3;
      else if (game.level === 3) game.level = 4;
      else if (game.level === 4) game.level = 5;
      startGame();
    });

    /* ---------- 朗讀（穩定版） ---------- */
    let resumeAfterSpeech = false;
    let speakTimer = null;
    let resumeTimer = null;
    let currentUtterance = null;
    let ttsVoices = [];
    let ttsUnlocked = false;

    if ('speechSynthesis' in window) {
      const loadVoices = () => { ttsVoices = window.speechSynthesis.getVoices(); };
      loadVoices();
      window.speechSynthesis.cancel(); // 清掉可能卡死的舊隊列
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }

    // 按瀏覽器挑可靠又自然的中文語音：
    // Chrome 只信 Google 語音（系統增強版在 Chrome 裡會靜音）；Edge 用 Neural；Safari 用增強版/Siri

    // 使用者在 tts.html 親自選定的聲音優先；'default' 表示強制瀏覽器預設
    function resolveVoice() {
      const stored = localStorage.getItem('chinese_tts_voice');
      if (stored === 'default') return null;
      if (stored) {
        const match = ttsVoices.find(v => v.name === stored);
        if (match) return match;
      }
      return bestZhVoice();
    }

    const BAD_VOICES = new Set();

    function bestZhVoice() {
      const ua = navigator.userAgent;
      const isEdge = /Edg\//.test(ua);
      const isChrome = /Chrome\//.test(ua) && !isEdge;
      const score = v => {
        const n = v.name.toLowerCase();
        let s = 0;
        if (isEdge && /natural|neural|online/.test(n)) s += 100;
        if (isChrome) {
          if (/google/.test(n)) s += 100;
          if (/enhanced|premium|natural|neural|siri/.test(n)) s -= 60;
        } else {
          if (/enhanced|premium/.test(n)) s += 30;
          if (/siri/.test(n)) s += 25;
        }
        if (/xiaoxiao|xiaoyi|yunxi|yunyang|yunjian/.test(n)) s += 20;
        if (/tingting|婷婷|meijia|美嘉|sinji/.test(n)) s += 10;
        if (/^zh[-_]cn/i.test(v.lang)) s += 8;
        return s;
      };
      return ttsVoices
        .filter(v => v.lang.toLowerCase().startsWith('zh') && !BAD_VOICES.has(v.name))
        .sort((a, b) => score(b) - score(a))[0] || null;
    }

    function unlockTTS() {
      window.NeuralTTS?.unlock();
      if (ttsUnlocked || !('speechSynthesis' in window)) return;
      ttsUnlocked = true;
      const utterance = new SpeechSynthesisUtterance(' ');
      utterance.volume = 0;
      window.speechSynthesis.speak(utterance);
    }

    function speakText(text) {
      if (!text) return Promise.resolve();
      // 神經語音（曉曉）優先，失敗自動回退瀏覽器語音
      if (window.NeuralTTS && window.NeuralTTS.enabled) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (game.listening && recognition && !resumeAfterSpeech) {
          resumeAfterSpeech = true;
          recognition.abort();
        }
        const finish = () => {
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => {
            if (resumeAfterSpeech && game.listening) {
              resumeAfterSpeech = false;
              try { startRecognition(); } catch { stopListening(); }
            }
          }, 300);
        };
        return window.NeuralTTS.speak(text).then(finish).catch(() => {
          window.NeuralTTS.markFailure();
          return browserSpeak(text);
        });
      }
      return browserSpeak(text);
    }

    function browserSpeak(text) {
      if (!('speechSynthesis' in window) || !text) return Promise.resolve();
      const synth = window.speechSynthesis;
      let justAborted = false;
      if (game.listening && recognition && !resumeAfterSpeech) {
        resumeAfterSpeech = true;
        justAborted = true;
        recognition.abort();
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      const voice = resolveVoice();
      if (voice) utterance.voice = voice;
      utterance.rate = 0.95;
      utterance.volume = 1;
      currentUtterance = utterance;
      const finish = () => {
        clearTimeout(resumeTimer);
        resumeTimer = setTimeout(() => {
          if (resumeAfterSpeech && game.listening && !synth.speaking && !synth.pending) {
            resumeAfterSpeech = false;
            try { startRecognition(); } catch { stopListening(); }
          }
        }, 300);
      };
      utterance.onend = finish;
      utterance.onerror = finish;
      // 「說完」的承諾：事件不觸發時按字數估時兜底
      const spoken = new Promise(resolve => {
        utterance.addEventListener('end', resolve);
        utterance.addEventListener('error', resolve);
        setTimeout(resolve, 2000 + text.length * 340);
      });
      const go = () => {
        synth.resume();
        let started = false;
        utterance.onstart = () => { started = true; };
        synth.speak(utterance);
        // 所選語音靜音時（Chrome + 系統增強版），2 秒自動拉黑並換預設語音重讀
        setTimeout(() => {
          if (started) return;
          if (utterance.voice) BAD_VOICES.add(utterance.voice.name);
          synth.cancel();
          const retry = new SpeechSynthesisUtterance(text);
          retry.lang = utterance.lang;
          retry.rate = utterance.rate;
          retry.volume = 1;
          retry.onend = finish;
          retry.onerror = finish;
          currentUtterance = retry;
          synth.speak(retry);
        }, 2000);
      };
      clearTimeout(speakTimer);
      if (synth.speaking || synth.pending) {
        synth.cancel();
        speakTimer = setTimeout(go, 100);
      } else if (justAborted) {
        speakTimer = setTimeout(go, 180);
      } else {
        go();
      }
      finish();
      return spoken;
    }

    /* ---------- 語音識別（每回合聽一句） ---------- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function startRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      let gotFinal = false;

      recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const text = result[0].transcript.trim();
          if (!text) continue;
          if (result.isFinal) {
            gotFinal = true;
            setLive(pageStrings.heard[language], text);
            acceptSentence(text);
          } else {
            setLive(pageStrings.heard[language], text);
          }
        }
      };

      recognition.onerror = event => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          stopListening();
          setLive(pageStrings.denied[language]);
        }
      };

      recognition.onend = () => {
        if (game.listening && !resumeAfterSpeech) {
          stopListening();
          if (!gotFinal && game.phase === 'listen') setLive(pageStrings.noSpeech[language]);
        }
      };

      recognition.start();
    }

    function stopListening() {
      game.listening = false;
      micButton.classList.remove('is-listening');
      if (recognition) { recognition.onend = null; recognition.abort(); }
    }

    micButton.addEventListener('click', () => {
      unlockTTS();
      if (game.listening) { stopListening(); setLive(''); return; }
      if (game.phase !== 'listen') return;
      game.listening = true;
      micButton.classList.add('is-listening');
      setLive(pageStrings[`listening${game.level}`][language]);
      try { startRecognition(); } catch { stopListening(); }
    });

    if (!SpeechRecognition) {
      micButton.disabled = true;
      setLive(pageStrings.unsupported[language]);
    }

    typeForm.addEventListener('submit', event => {
      event.preventDefault();
      unlockTTS();
      const text = typeInput.value.trim();
      if (text) acceptSentence(text);
      typeInput.value = '';
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && game.listening) stopListening();
    });

    updateHud();
    applyLanguage(language);
  </script>
</body>
</html>
