<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>漢字龍虎鬥 — Chinese.org</title>
  <meta name="description" content="兩人對戰：輪流說一句話，說出的字飛向對方，在空中碰撞。旗鼓相當的字會交換偏旁變成新字——打碰上江，變成扛和汀！">
  <meta name="theme-color" content="#0b0b0a">
  <meta property="og:title" content="漢字龍虎鬥 — Chinese.org">
  <meta property="og:description" content="說話對戰，漢字相撞，偏旁重組成新字！">
  <meta property="og:image" content="https://chinese.org/assets/og-premium.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chinese.org/pk.html">
  <link rel="icon" href="assets/logo-hua.png" type="image/png">
  <style>
    :root {
      --ink: #0b0b0a;
      --ink-soft: #161714;
      --paper: #f1eee6;
      --coral: #e36a4c;
      --gold: #c39a54;
      --led-gold: #ffd98a;
      --led-red: #ff6b52;
      --jade: #7fd8b8;
      --blue: #7ab8ff;
      --muted: rgba(241, 238, 230, .52);
      --line: rgba(241, 238, 230, .14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "PingFang TC", "Hiragino Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    /* 手機豎拿時整體轉 90°（橫版遊戲） */
    @media (max-width: 820px) and (orientation: portrait) and (hover: none) and (pointer: coarse) {
      body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvh;
        height: 100dvw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 10, .92);
      z-index: 20;
    }

    .bar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--paper);
      text-decoration: none;
    }

    .bar-brand img { width: 22px; height: 22px; filter: invert(1); }

    .bar-brand strong { font-size: 10px; font-weight: 800; letter-spacing: .16em; }

    .bar-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--led-gold);
    }

    .round-pill {
      padding: 3px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ---------- 戰場 ---------- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 50%, rgba(227, 106, 76, .14), transparent 42%),
        radial-gradient(circle at 88% 50%, rgba(195, 154, 84, .14), transparent 42%),
        var(--ink);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .05) 1px, transparent 1.5px);
      background-size: 13px 13px;
    }

    .side {
      position: relative;
      z-index: 3;
      width: 118px;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
    }

    .side .face {
      font-size: 44px;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(227, 106, 76, .45));
      transition: transform 200ms ease;
    }

    .side.right .face { filter: drop-shadow(0 0 14px rgba(195, 154, 84, .5)); }

    .side .face.is-hit { animation: shake 400ms ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px) rotate(-6deg); }
      75% { transform: translateX(7px) rotate(6deg); }
    }

    .side .name { font-size: 13px; font-weight: 800; letter-spacing: .18em; }

    .side.left .name { color: var(--led-red); }
    .side.right .name { color: var(--led-gold); }

    .side .hp { font-size: 12px; letter-spacing: 2px; }

    .side .points { font-size: 12px; color: var(--muted); }

    .side .points b { color: var(--paper); font-size: 15px; }

    .shelf {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      min-height: 30px;
      max-width: 110px;
    }

    .shelf button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(127, 216, 184, .5);
      border-radius: 7px;
      font-size: 17px;
      font-weight: 800;
      color: var(--jade);
      background: rgba(127, 216, 184, .08);
    }

    .field { position: relative; z-index: 2; flex: 1; min-width: 0; }

    .turn-banner {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      padding: 6px 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(11, 11, 10, .85);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .1em;
      white-space: nowrap;
      transition: border-color 250ms ease, color 250ms ease;
    }

    .turn-banner.for-left { border-color: var(--led-red); color: var(--led-red); }
    .turn-banner.for-right { border-color: var(--led-gold); color: var(--led-gold); }
    .turn-banner.for-battle { border-color: var(--jade); color: var(--jade); }

    .tile {
      position: absolute;
      z-index: 5;
      display: grid;
      place-items: center;
      width: var(--tile);
      height: var(--tile);
      font-size: calc(var(--tile) * .68);
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      will-change: transform;
      transition: transform 700ms cubic-bezier(.25, .8, .35, 1);
    }

    .tile.from-left {
      color: var(--led-red);
      border: 1px solid rgba(255, 107, 82, .55);
      background: rgba(255, 107, 82, .1);
      text-shadow: 0 0 12px rgba(255, 107, 82, .55);
    }

    .tile.from-right {
      color: var(--led-gold);
      border: 1px solid rgba(255, 217, 138, .5);
      background: rgba(255, 217, 138, .08);
      text-shadow: 0 0 12px rgba(255, 217, 138, .55);
    }

    .tile.newborn {
      color: var(--jade);
      border: 1px solid rgba(127, 216, 184, .6);
      background: rgba(127, 216, 184, .12);
      text-shadow: 0 0 16px rgba(127, 216, 184, .7);
      animation: newborn-pop 500ms ease;
    }

    @keyframes newborn-pop {
      0% { scale: .2; }
      70% { scale: 1.25; }
      100% { scale: 1; }
    }

    .tile small {
      position: absolute;
      bottom: -16px;
      font-size: 11px;
      font-weight: 400;
      color: var(--jade);
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .tile i {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(11, 11, 10, .92);
      border: 1px solid currentColor;
      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      text-shadow: none;
    }

    .tile.wordborn {
      width: auto;
      min-width: var(--tile);
      padding: 0 12px;
      letter-spacing: .06em;
    }

    /* 偏旁拆解重組動畫 */
    .part-tile {
      position: absolute;
      z-index: 8;
      display: grid;
      place-items: center;
      width: var(--part);
      height: var(--part);
      font-size: calc(var(--part) * .68);
      font-weight: 800;
      color: var(--jade);
      text-shadow: 0 0 14px rgba(127, 216, 184, .75);
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 10px;
      background: rgba(11, 11, 10, .88);
      will-change: transform;
      transition: transform 1150ms cubic-bezier(.3, .9, .35, 1.1), opacity 350ms ease;
    }

    /* 新字講解卡 */
    .newchar-card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(620px, 94%);
      padding: 16px 20px;
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 18px;
      background: rgba(11, 11, 10, .95);
      backdrop-filter: blur(6px);
      animation: card-in 320ms ease;
    }

    .newchar-card .nc-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .14em;
      color: var(--led-gold);
    }

    .nc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
      width: 100%;
    }

    .nc-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid rgba(241, 238, 230, .12);
      border-radius: 14px;
    }

    .nc-head { display: flex; align-items: baseline; gap: 10px; }

    .nc-head b {
      font-size: 50px;
      font-weight: 800;
      color: var(--jade);
      text-shadow: 0 0 18px rgba(127, 216, 184, .6);
      line-height: 1.05;
    }

    .nc-head span { font-size: 19px; font-weight: 700; color: var(--led-gold); }

    .nc-words { font-size: 14px; color: var(--paper); letter-spacing: .04em; }

    .nc-sent {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .nc-sent small { display: block; font-size: 11px; color: rgba(241, 238, 230, .38); }

    @media (max-width: 700px) {
      .nc-grid { grid-template-columns: 1fr; }
      .nc-head b { font-size: 40px; }
    }

    .swap-note {
      position: absolute;
      z-index: 9;
      transform: translateX(-50%);
      padding: 5px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 217, 138, .5);
      background: rgba(11, 11, 10, .92);
      color: var(--led-gold);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      white-space: nowrap;
      pointer-events: none;
      animation: card-in 250ms ease;
    }

    /* 相遇詳解卡 */
    .clash-card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: min(420px, 86%);
      max-width: 92%;
      padding: 14px 22px;
      border: 1px solid rgba(127, 216, 184, .5);
      border-radius: 18px;
      background: rgba(11, 11, 10, .94);
      backdrop-filter: blur(6px);
      animation: card-in 320ms ease;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translate(-50%, -46%) scale(.92); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .cc-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .cc-fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 110px;
    }

    .cc-fighter b {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.1;
    }

    .cc-fighter small {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .evo-row {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }

    .evo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .evo-item b {
      font-size: 30px;
      font-weight: 400;
      color: var(--led-gold);
      line-height: 1.15;
    }

    .evo-item small {
      font-size: 9px;
      color: rgba(241, 238, 230, .42);
      letter-spacing: .12em;
    }

    .cc-vs {
      font-size: 15px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .1em;
    }

    .cc-verdict {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--jade);
      text-align: center;
    }

    .cc-result {
      font-size: 14px;
      color: var(--led-gold);
      letter-spacing: .06em;
      text-align: center;
    }

    .shelf button { width: auto; min-width: 28px; padding: 0 5px; }

    /* ---------- 遮罩 ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(11, 11, 10, .9);
      backdrop-filter: blur(6px);
    }

    .overlay.is-visible { display: flex; }

    .overlay h2 {
      font-size: clamp(22px, 5.5vmin, 36px);
      letter-spacing: .12em;
      color: var(--led-gold);
      text-shadow: 0 0 24px rgba(255, 217, 138, .4);
    }

    .overlay p { max-width: 520px; font-size: 13px; line-height: 1.9; color: var(--muted); }

    .overlay .demo {
      font-size: 20px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: .08em;
    }

    .overlay .demo b { color: var(--jade); }

    .cta {
      padding: 12px 36px;
      border-radius: 999px;
      background: linear-gradient(160deg, #ff7a54, #a83a28);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #fff;
      box-shadow: 0 10px 34px rgba(227, 106, 76, .4);
    }

    .cta:active { transform: scale(.96); }

    .won-chars { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 520px; }

    .won-chars button {
      padding: 5px 11px;
      border: 1px solid rgba(127, 216, 184, .55);
      border-radius: 10px;
      font-size: 19px;
      font-weight: 800;
      color: var(--jade);
      background: rgba(127, 216, 184, .08);
    }

    /* ---------- 底欄 ---------- */
    .live {
      min-height: 24px;
      padding: 3px 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live b { color: var(--led-gold); font-weight: 600; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--ink-soft);
    }

    .mic {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      background: linear-gradient(160deg, #ff7a54, #a83a28);
      box-shadow: 0 8px 26px rgba(227, 106, 76, .4);
      transition: transform 150ms ease, background 250ms ease;
    }

    .mic.for-right { background: linear-gradient(160deg, #ffd98a, #a5762c); }

    .mic:active { transform: scale(.94); }

    .mic[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; }

    .mic.is-listening::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid rgba(255, 122, 84, .8);
      border-radius: 50%;
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.92); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .typebox { display: flex; flex: 1; max-width: 300px; gap: 6px; }

    .typebox input {
      flex: 1;
      min-width: 0;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      color: var(--paper);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .typebox input:focus { border-color: var(--coral); }

    .typebox button {
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(227, 106, 76, .22);
      border: 1px solid var(--coral);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .side { width: 88px; }
      .side .face { font-size: 36px; }
      .bar-brand strong { display: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="bar-brand" href="index.html" aria-label="回到 Chinese.org 首頁">
      <img src="assets/logo-hua.png" alt="">
      <strong>CHINESE.ORG</strong>
    </a>
    <p class="bar-title" data-zht="漢字龍虎鬥" data-zhs="汉字龙虎斗" data-en="Hanzi Battle">漢字龍虎鬥</p>
    <span class="round-pill"><span data-zht="回合" data-zhs="回合" data-en="Round">回合</span> <b id="roundCount">1</b></span>
  </header>

  <main class="stage">
    <div class="side left">
      <div class="face" id="faceL">🐲</div>
      <div class="name" data-zht="紅龍隊" data-zhs="红龙队" data-en="RED DRAGON">紅龍隊</div>
      <div class="hp" id="hpL">❤️❤️❤️❤️❤️</div>
      <div class="points"><b id="pointsL">0</b> <span data-zht="分" data-zhs="分" data-en="pts">分</span></div>
      <div class="shelf" id="shelfL"></div>
    </div>

    <div class="field" id="field">
      <div class="turn-banner" id="turnBanner"></div>

      <div class="overlay is-visible" id="startOverlay">
        <h2 data-zht="漢字龍虎鬥" data-zhs="汉字龙虎斗" data-en="Hanzi Battle">漢字龍虎鬥</h2>
        <p data-zht="兩個人面對面，每回合各說一個字。兩個字在空中相遇時，會按五行判定：相生的字可以結盟——組成新詞或交換偏旁變出新字；相剋的字就開戰——剋者獲勝、直衝對方掉一顆心；拚不出新字就比組字力——能和場上任何字拼出新字的勝出。每次相遇都會講解兩個字的五行與部件由來。心先掉光的一方輸！" data-zhs="两个人面对面，每回合各说一个字。两个字在空中相遇时，会按五行判定：相生的字可以结盟——组成新词或交换偏旁变出新字；相克的字就开战——克者获胜、直冲对方掉一颗心；拼不出新字就比组字力——能和场上任何字拼出新字的胜出。每次相遇都会讲解两个字的五行与部件由来。心先掉光的一方输！" data-en="Each player says one character per round. When the two meet, the Five Elements decide: mutually generating characters ally—forming a word or swapping radicals into new characters; opposing characters fight—the conquering element wins and costs the opponent a heart; otherwise it's a forging contest—the character that can forge a new character with anything on screen wins. Every clash explains each character's element and components. Lose all hearts and you lose!">兩個人面對面，每回合各說一個字。兩個字在空中相遇時，會按五行判定：相生的字可以結盟——組成新詞或交換偏旁變出新字；相剋的字就開戰——剋者獲勝、直衝對方掉一顆心；拚不出新字就比組字力——能和場上任何字拼出新字的勝出。每次相遇都會講解兩個字的五行與部件由來。心先掉光的一方輸！</p>
        <div class="demo">江(水) + 灯(火) → 水剋火！　·　打 + 江 → <b>扛</b> + <b>汀</b></div>
        <p style="font-size:10px; color:rgba(241,238,230,.32); letter-spacing:.05em;" data-zht="篆體字形：崇羲篆體（中研院小學堂）· CC BY-ND" data-zhs="篆体字形：崇羲篆体（中研院小学堂）· CC BY-ND" data-en="Seal glyphs: ChongXi Seal (Academia Sinica) · CC BY-ND">篆體字形：崇羲篆體（中研院小學堂）· CC BY-ND</p>
        <button class="cta" id="startL1" type="button" data-zht="第一關 · 單字對決" data-zhs="第一关 · 单字对决" data-en="Level 1 · One-Character Duel">第一關 · 單字對決</button>
        <button class="cta" id="startL2" type="button" style="background: linear-gradient(160deg, #ffd98a, #a5762c);" data-zht="第二關 · 句子擂臺" data-zhs="第二关 · 句子擂台" data-en="Level 2 · Sentence Arena">第二關 · 句子擂臺</button>
      </div>

      <div class="overlay" id="endOverlay">
        <h2 id="winnerTitle"></h2>
        <p id="endStats"></p>
        <p data-zht="這一戰造出的新字，點一點聽聽看：" data-zhs="这一战造出的新字，点一点听听看：" data-en="New characters forged in this battle—tap to hear:">這一戰造出的新字，點一點聽聽看：</p>
        <div class="won-chars" id="wonChars"></div>

      <div class="face" id="faceR">🐯</div>
      <div class="name" data-zht="金虎隊" data-zhs="金虎队" data-en="GOLD TIGER">金虎隊</div>
      <div class="hp" id="hpR">❤️❤️❤️❤️❤️</div>
      <div class="points"><b id="pointsR">0</b> <span data-zht="分" data-zhs="分" data-en="pts">分</span></div>

  </main>

  <p class="live" id="liveLine" aria-live="polite"></p>

  <footer class="controls">
    <button class="mic" id="micButton" type="button" aria-label="說話">🎤</button>
    <form class="typebox" id="typeForm">
      <input id="typeInput" type="text" maxlength="12" autocomplete="off" placeholder="打字也可以出招">
      <button type="submit" data-zht="出招！" data-zhs="出招！" data-en="Go!">出招！</button>
    </form>
  </footer>

  <script src="hanzi-parts.js"></script>
  <script src="wuxing-ciyu.js?v=2"></script>
  <script src="opencc-t2cn.js"></script>
  <script src="tangshi300.js"></script>
  <script>
    /* ---------- UI 語言 ---------- */
    const translatable = document.querySelectorAll('[data-zht][data-zhs][data-en]');
    let language = localStorage.getItem('chinese_language') || 'zht';

    const pageStrings = {
      title: { zht: '漢字龍虎鬥 — Chinese.org', zhs: '汉字龙虎斗 — Chinese.org', en: 'Hanzi Battle — Chinese.org' },
      typePlaceholder1: { zht: '打一個字也可以出招', zhs: '打一个字也可以出招', en: 'Type one character' },
      typePlaceholder2: { zht: '打一句話也可以出招', zhs: '打一句话也可以出招', en: 'Type a sentence' },
      turnLeft1: { zht: '🐲 紅龍隊，說一個字！', zhs: '🐲 红龙队，说一个字！', en: '🐲 Red Dragon, say one character!' },
      turnRight1: { zht: '🐯 金虎隊，說一個字！', zhs: '🐯 金虎队，说一个字！', en: '🐯 Gold Tiger, say one character!' },
      turnLeft2: { zht: '🐲 紅龍隊，說一句話！', zhs: '🐲 红龙队，说一句话！', en: '🐲 Red Dragon, say a sentence!' },
      turnRight2: { zht: '🐯 金虎隊，說一句話！', zhs: '🐯 金虎队，说一句话！', en: '🐯 Gold Tiger, say a sentence!' },
      battle: { zht: '⚔️ 漢字對撞！', zhs: '⚔️ 汉字对撞！', en: '⚔️ Characters clash!' },
      listening1: { zht: '我在聽……說出你的字！', zhs: '我在听……说出你的字！', en: 'Listening… say your character!' },
      listening2: { zht: '我在聽……說完一句自動上擂臺！', zhs: '我在听……说完一句自动上擂台！', en: 'Listening… your sentence enters the arena!' },
      nextLevel: { zht: '下一關：句子擂臺 →', zhs: '下一关：句子擂台 →', en: 'Next: Sentence Arena →' },
      again: { zht: '再戰一場', zhs: '再战一场', en: 'Rematch' },
      heard: { zht: '聽到：', zhs: '听到：', en: 'Heard: ' },
      noSpeech: { zht: '沒聽清，再按一次麥克風試試', zhs: '没听清，再按一次麦克风试试', en: 'Didn\'t catch that—tap the mic again' },
      denied: { zht: '需要麥克風權限，也可以用打字出招。', zhs: '需要麦克风权限，也可以用打字出招。', en: 'Mic access needed—typing works too.' },
      unsupported: { zht: '這個瀏覽器不支援語音識別，用打字框出招，或改用 Chrome / Safari。', zhs: '这个浏览器不支持语音识别，用打字框出招，或改用 Chrome / Safari。', en: 'No speech recognition here—type your moves, or use Chrome / Safari.' },
      winLeft: { zht: '🐲 紅龍隊獲勝！', zhs: '🐲 红龙队获胜！', en: '🐲 Red Dragon wins!' },
      winRight: { zht: '🐯 金虎隊獲勝！', zhs: '🐯 金虎队获胜！', en: '🐯 Gold Tiger wins!' },
      statsTemplate: {
        zht: n => `打了 ${n.rounds} 個回合 · 一共變出 ${n.newChars} 個新字新詞`,
        zhs: n => `打了 ${n.rounds} 个回合 · 一共变出 ${n.newChars} 个新字新词`,
        en: n => `${n.rounds} rounds · ${n.newChars} new characters & words forged`
      },
      resultWord: {
        zht: w => `相生結盟，組成新詞「${w}」！`, zhs: w => `相生结盟，组成新词“${w}”！`, en: w => `They join into the word "${w}"!`
      },
      resultCombo: {
        zht: (a, b) => `交換偏旁，變出新字：${a} · ${b}！`, zhs: (a, b) => `交换偏旁，变出新字：${a} · ${b}！`, en: (a, b) => `Radicals swap into ${a} and ${b}!`
      },
      resultKe: {
        zht: c => `「${c}」勝出，直衝對方！`, zhs: c => `“${c}”胜出，直冲对方！`, en: c => `"${c}" wins and charges ahead!`
      },
      resultShengPeace: {
        zht: '相生共榮，兩隊各得一分', zhs: '相生共荣，两队各得一分', en: 'They nourish each other—one point each'
      },
      verdictSame: {
        zht: el => `同屬${el}，比筆畫定勝負！`, zhs: el => `同属${el}，比笔画定胜负！`, en: el => `Both ${EL_EN[el]}—stroke count decides!`
      },
      verdictSameAlly: {
        zht: el => `同屬${el}，同氣連枝！`, zhs: el => `同属${el}，同气连枝！`, en: el => `Both ${EL_EN[el]}—kindred spirits!`
      },
      verdictForge: {
        zht: '比組字力！誰能拼出新字？', zhs: '比组字力！谁能拼出新字？', en: 'Forging contest! Who can make a new character?'
      },
      resultForge: {
        zht: (c, p, m) => `「${c}」能與「${p}」拼成「${m}」，勝出！`,
        zhs: (c, p, m) => `“${c}”能与“${p}”拼成“${m}”，胜出！`,
        en: (c, p, m) => `"${c}" can forge "${m}" with "${p}"—it wins!`
      },
      verdictAlly: {
        zht: '字字有緣，結盟！', zhs: '字字有缘，结盟！', en: 'A perfect match!'
      },
      resultStroke: {
        zht: (c, n, m) => `「${c}」${n} 畫勝 ${m} 畫！`, zhs: (c, n, m) => `“${c}”${n} 画胜 ${m} 画！`, en: (c, n, m) => `"${c}" wins, ${n} vs ${m} strokes!`
      },
      resultTie: {
        zht: '勢均力敵，同歸於盡！', zhs: '势均力敌，同归于尽！', en: 'Evenly matched—both shatter!'
      }
    };

    function applyLanguage(next) {
      language = next;
      localStorage.setItem('chinese_language', language);
      translatable.forEach(el => { el.textContent = el.dataset[language]; });
      document.title = pageStrings.title[language];
      typeInput.placeholder = pageStrings[`typePlaceholder${game.level}`][language];
    }

    /* ---------- 資料 ---------- */
    const PARTS = window.HANZI_PARTS || { d: {}, c: {}, p: {} };
    const HAN = /[㐀-鿿]/;


    /* ---------- 五行與詞語 ---------- */
    const ELEMENT_OF = {};
    const RADICAL_OF = {};
    Object.entries(window.HANZI_WUXING || {}).forEach(([char, value]) => {
      ELEMENT_OF[char] = value[0];
      RADICAL_OF[char] = value.slice(1);
    });

    const WORD_SET = new Set();
    {
      const s = window.CIYU2 || '';
      for (let i = 0; i + 1 < s.length; i += 2) WORD_SET.add(s.slice(i, i + 2));
    }

    const SHENG = { 木: '火', 火: '土', 土: '金', 金: '水', 水: '木' };
    const KE = { 木: '土', 土: '水', 水: '火', 火: '金', 金: '木' };
    const EL_COLOR = { 金: '#ffd98a', 木: '#7fd8b8', 水: '#7ab8ff', 火: '#ff6b52', 土: '#c39a54' };
    const EL_EN = { 金: 'Metal', 木: 'Wood', 水: 'Water', 火: 'Fire', 土: 'Earth' };

    function elementOf(char) {
      return ELEMENT_OF[char] || null;
    }

    // 組字力：這個字能和「場上任何字」拼出新字嗎？
    function forgePower(char, allChars) {
      let count = 0;
      let sample = null;
      for (const other of allChars) {
        if (other === char || other.length !== 1) continue;
        const made = recombine(char, other);
        if (made) {
          count += 1;
          if (!sample) sample = { partner: other, made: made[0] };
        }
      }
      return { count, sample };
    }

    // 每個字五行的「由來」說明
    function elementWhy(char) {
      const element = elementOf(char);
      if (RADICAL_OF[char]) {
        const r = RADICAL_OF[char];
        return {
          zht: `「${r}」部，五行屬${element}`,
          zhs: `“${r}”部，五行属${element}`,
          en: `radical ${r} → ${EL_EN[element]}`
        };
      }
      if (PARTS.d[char]) {
        const [l, r] = PARTS.d[char];
        return {
          zht: `部件：${l} ＋ ${r}`,
          zhs: `部件：${l} ＋ ${r}`,
          en: `parts: ${l} + ${r}`
        };
      }
      return { zht: '獨體字', zhs: '独体字', en: 'single-component' };
    }

    // 相生相剋的典故背景
    const SHENG_STORY = {
      '木火': { zht: '鑽木取火，木能生火', zhs: '钻木取火，木能生火', en: 'Wood feeds Fire' },
      '火土': { zht: '火燒成灰，灰歸於土', zhs: '火烧成灰，灰归于土', en: 'Fire makes Earth' },
      '土金': { zht: '礦藏於土，土能生金', zhs: '矿藏于土，土能生金', en: 'Earth bears Metal' },
      '金水': { zht: '金遇寒凝露，金能生水', zhs: '金遇寒凝露，金能生水', en: 'Metal collects Water' },
      '水木': { zht: '水潤草木，水能生木', zhs: '水润草木，水能生木', en: 'Water grows Wood' }
    };

    const KE_STORY = {
      '木土': { zht: '樹根破土，木能剋土', zhs: '树根破土，木能克土', en: 'Wood breaks Earth' },
      '土水': { zht: '水來土掩，土能剋水', zhs: '水来土掩，土能克水', en: 'Earth dams Water' },
      '水火': { zht: '水能滅火，水剋火', zhs: '水能灭火，水克火', en: 'Water quenches Fire' },
      '火金': { zht: '烈火熔金，火剋金', zhs: '烈火熔金，火克金', en: 'Fire melts Metal' },
      '金木': { zht: '利刃伐木，金剋木', zhs: '利刃伐木，金克木', en: 'Metal cuts Wood' }
    };

    function wordOf(a, b) {
      if (WORD_SET.has(a + b)) return a + b;
      if (WORD_SET.has(b + a)) return b + a;
      return null;
    }

    // 每個字最常用的組詞（離線從全詞庫預計算）
    const WORDS_OF = window.CIYU_BY_CHAR || {};

    // 唐詩例句索引（懶載入：第一次用到才轉換）
    let POEM_LINES = null;

    function findPoemLine(char) {
      if (!POEM_LINES) {
        POEM_LINES = [];
        const convert = window.OpenCC ? window.OpenCC.Converter({ from: 't', to: 'cn' }) : (t => t);
        (window.TANGSHI_300 || []).forEach(poem => {
          const title = convert(poem.title || '');
          const author = convert(poem.author || '');
          poem.paragraphs.forEach(paragraph => {
            const simplified = convert(paragraph);
            paragraph.split(/[，。！？；：、\s]+/).forEach((clauseT, i) => {
              const clauseS = simplified.split(/[，。！？；：、\s]+/)[i] || '';
              if (clauseS.length >= 3 && clauseS.length <= 9) {
                POEM_LINES.push({ text: clauseS, textT: clauseT, title, author });
              }
            });
          });
        });
      }
      return POEM_LINES.find(line => line.text.includes(char)) || null;
    }

    // 新字講解：拼音 + 組詞 + 例句（唐詩優先，否則引導造句）
    function explainChar(char) {
      const pinyin = PARTS.p[char] || '';
      const words = (WORDS_OF[char] || []).slice(0, 2);
      const line = findPoemLine(char);
      return { char, pinyin, words, line };
    }

    // 交換偏旁：打(扌丁) + 江(氵工) -> 扛(扌工) + 汀(氵丁)
    function recombine(a, b) {
      const da = PARTS.d[a];
      const db = PARTS.d[b];
      if (!da || !db) return null;
      const n1 = PARTS.c[da[0] + db[1]];
      const n2 = PARTS.c[db[0] + da[1]];
      if (!n1 || !n2) return null;
      const before = new Set([a, b]);
      if (before.has(n1) && before.has(n2)) return null;
      return [n1, n2];
    }

    /* ---------- DOM ---------- */
    const field = document.getElementById('field');
    const turnBanner = document.getElementById('turnBanner');
    const liveLine = document.getElementById('liveLine');
    const micButton = document.getElementById('micButton');
    const typeForm = document.getElementById('typeForm');
    const typeInput = document.getElementById('typeInput');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');

    /* ---------- 遊戲狀態 ---------- */
    const game = {
      phase: 'idle',        // idle | listen | battle | over
      level: 1,             // 1 = 單字對決, 2 = 句子擂臺
      turn: 'L',
      starter: 'L',
      round: 1,
      hp: { L: 5, R: 5 },
      points: { L: 0, R: 0 },
      squads: { L: [], R: [] },   // 本回合的字 tile 物件
      newChars: [],
      listening: false
    };

    function maxChars() { return game.level === 1 ? 1 : 6; }

    function tileSize() {
      return Math.max(40, Math.min(60, Math.floor(field.clientWidth / 12)));
    }

    function setBanner(kind) {
      turnBanner.className = 'turn-banner';
      if (kind === 'L') { turnBanner.classList.add('for-left'); turnBanner.textContent = pageStrings[`turnLeft${game.level}`][language]; }
      else if (kind === 'R') { turnBanner.classList.add('for-right'); turnBanner.textContent = pageStrings[`turnRight${game.level}`][language]; }
      else { turnBanner.classList.add('for-battle'); turnBanner.textContent = pageStrings.battle[language]; }
      micButton.classList.toggle('for-right', kind === 'R');
    }

    function setLive(text, highlight) {
      liveLine.innerHTML = '';
      if (highlight) {
        const b = document.createElement('b');
        b.textContent = highlight;
        liveLine.append(text, b);
      } else {
        liveLine.textContent = text;
      }
    }

    function updateHud() {
      document.getElementById('hpL').textContent = '❤️'.repeat(game.hp.L) + '🖤'.repeat(5 - game.hp.L);
      document.getElementById('hpR').textContent = '❤️'.repeat(game.hp.R) + '🖤'.repeat(5 - game.hp.R);
      document.getElementById('pointsL').textContent = game.points.L;
      document.getElementById('pointsR').textContent = game.points.R;
      document.getElementById('roundCount').textContent = game.round;
    }

    /* ---------- Tile ---------- */
    function rowY(index, total) {
      const h = field.clientHeight;
      const size = tileSize();
      const top = h * 0.16;
      const usable = h * 0.62;
      if (total <= 1) return top + usable / 2 - size / 2;
      return top + (usable / (total - 1)) * index - size / 2 + (usable === 0 ? 0 : 0);
    }

    function makeTile(char, sideKey, index, total) {
      const size = tileSize();
      const el = document.createElement('div');
      el.className = `tile from-${sideKey === 'L' ? 'left' : 'right'}`;
      el.style.setProperty('--tile', `${size}px`);
      el.textContent = char;
      const element = elementOf(char);
      if (element || PARTS.d[char]) {
        const badge = document.createElement('i');
        badge.textContent = element || PARTS.d[char][0];
        badge.style.color = element ? EL_COLOR[element] : 'var(--jade)';
        el.append(badge);
      }
      const startX = sideKey === 'L' ? -size : field.clientWidth;
      el.style.transform = `translate(${startX}px, ${rowY(index, total)}px)`;
      field.append(el);
      el.addEventListener('pointerdown', () => speakText(char));
      const tile = { char, el, side: sideKey, index, total, launched: false };
      // 進場：懸停在本方三分之一處（已出戰的字不再回頭）
      requestAnimationFrame(() => {
        if (tile.launched) return;
        const hoverX = sideKey === 'L' ? field.clientWidth * 0.24 : field.clientWidth * 0.76 - size;
        el.style.transform = `translate(${hoverX}px, ${rowY(index, total)}px)`;
      });
      return tile;
    }

    function moveTile(tile, x, y, ms) {
      tile.el.style.transitionDuration = `${ms}ms`;
      tile.el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function burstTile(tile) {
      const el = tile.el;
      const matrix = getComputedStyle(el).transform;
      const anim = el.animate(
        [
          { transform: `${matrix === 'none' ? '' : matrix} scale(1)`, opacity: 1 },
          { transform: `${matrix === 'none' ? '' : matrix} scale(1.8)`, opacity: 0 }
        ],
        { duration: 320, easing: 'ease-out' }
      );
      anim.onfinish = () => el.remove();
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    // 偏旁重組動畫：兩字裂成部件 → 右偏旁互換 → 合成新字
    async function comboSwap(a, b, n1, n2, y, size, midX) {
      const [l1, r1] = PARTS.d[a.char];
      const [l2, r2] = PARTS.d[b.char];
      const partSize = Math.round(size * 0.66);
      const partY = y + (size - partSize) / 2;

      const makePart = (ch, x) => {
        const el = document.createElement('div');
        el.className = 'part-tile';
        el.style.setProperty('--part', `${partSize}px`);
        el.textContent = ch;
        el.style.transform = `translate(${x}px, ${partY}px)`;
        field.append(el);
        return el;
      };

      // 四個部件先出現在原字位置
      const aX = midX - size * 0.56;
      const bX = midX + size * 0.56;
      burstTile(a);
      burstTile(b);
      const p1 = makePart(l1, aX);
      const p2 = makePart(r1, aX);
      const p3 = makePart(l2, bX);
      const p4 = makePart(r2, bX);
      await wait(80);

      // 散開成兩組
      const g1L = midX - size * 1.3;
      const g1R = midX - size * 0.55;
      const g2L = midX + size * 0.55;
      const g2R = midX + size * 1.3;
      p1.style.transform = `translate(${g1L}px, ${partY}px)`;
      p2.style.transform = `translate(${g1R}px, ${partY}px)`;
      p3.style.transform = `translate(${g2L}px, ${partY}px)`;
      p4.style.transform = `translate(${g2R}px, ${partY}px)`;
      await wait(1400);

      // 右偏旁互換（轉一圈慢慢飛過去）
      const note = document.createElement('div');
      note.className = 'swap-note';
      note.textContent = `${l1}+${r2}=${n1} · ${l2}+${r1}=${n2}`;
      note.style.left = `${midX + size / 2}px`;
      note.style.top = `${y + size * 1.25}px`;
      field.append(note);
      p2.style.transform = `translate(${g2R}px, ${partY}px) rotate(360deg)`;
      p4.style.transform = `translate(${g1R}px, ${partY}px) rotate(-360deg)`;
      await wait(1600);

      // 各組合體成新字
      p1.style.transform = `translate(${(g1L + g1R) / 2}px, ${partY}px)`;
      p4.style.transform = `translate(${(g1L + g1R) / 2}px, ${partY}px) rotate(-360deg)`;
      p3.style.transform = `translate(${(g2L + g2R) / 2}px, ${partY}px)`;
      p2.style.transform = `translate(${(g2L + g2R) / 2}px, ${partY}px) rotate(360deg)`;
      await wait(700);
      [p1, p2, p3, p4].forEach(p => { p.style.opacity = '0'; });
      await wait(300);
      [p1, p2, p3, p4].forEach(p => p.remove());
      setTimeout(() => note.remove(), 2200);
    }

    // 新字講解卡：拼音 + 組詞 + 例句
    async function showNewCharCard(n1, n2, holdMs = 9000) {
      const card = document.createElement('div');
      card.className = 'newchar-card';
      const title = document.createElement('div');
      title.className = 'nc-title';
      title.textContent = { zht: '✨ 變出新字！', zhs: '✨ 变出新字！', en: '✨ New characters!' }[language];
      const grid = document.createElement('div');
      grid.className = 'nc-grid';

      const speakParts = [];
      [n1, n2].forEach(char => {
        const info = explainChar(char);
        const item = document.createElement('div');
        item.className = 'nc-item';
        const head = document.createElement('div');
        head.className = 'nc-head';
        const big = document.createElement('b');
        big.textContent = char;
        const py = document.createElement('span');
        py.textContent = info.pinyin;
        head.append(big, py);
        item.append(head, evoRow(char));
        if (info.words.length) {
          const words = document.createElement('div');
          words.className = 'nc-words';
          words.textContent = { zht: '組詞：', zhs: '组词：', en: 'Words: ' }[language] + info.words.join(' · ');
          item.append(words);
        }
        const sent = document.createElement('div');
        sent.className = 'nc-sent';
        if (info.line) {
          sent.textContent = language === 'zht' ? info.line.textT : info.line.text;
          const source = document.createElement('small');
          source.textContent = `${info.line.author}《${info.line.title}》`;
          sent.append(source);
        } else if (info.words.length) {
          sent.textContent = {
            zht: `試著用「${info.words[0]}」說一句話吧！`,
            zhs: `试着用“${info.words[0]}”说一句话吧！`,
            en: `Try saying a sentence with "${info.words[0]}"!`
          }[language];
        }
        item.append(sent);
        item.addEventListener('pointerdown', () => speakText(char));
        grid.append(item);

        let part = `${char}`;
        if (info.words.length) part += `。组词：${info.words.join('，')}`;
        if (info.line) part += `。诗句：${info.line.text}`;
        else if (info.words.length) part += `。试着用${info.words[0]}说一句话吧`;
        speakParts.push(part);
      });

      card.append(title, grid);
      field.append(card);
      speakText(`变出新字！${speakParts.join('。')}！`);
      await wait(holdMs);
      card.remove();
    }

    /* 篆體字體（崇羲篆體，中研院小學堂，CC BY-ND，原樣轉發）背景載入 */
    let sealReady = false;
    if (window.FontFace && document.fonts) {
      const sealFont = new FontFace('ChongXi Seal', "url('assets/chongxi_seal.otf')", { display: 'swap' });
      sealFont.load().then(loaded => {
        document.fonts.add(loaded);
        sealReady = true;
      }).catch(() => {});
    }

    const EVO_STAGES = [
      { key: 'seal', label: { zht: '小篆', zhs: '小篆', en: 'SEAL' }, family: "'ChongXi Seal', serif" },
      { key: 'kai', label: { zht: '楷書', zhs: '楷书', en: 'KAI' }, family: "'Kaiti SC', 'Kaiti TC', 'STKaiti', 'DFKai-SB', 'BiauKai', serif" },
      { key: 'xing', label: { zht: '行草', zhs: '行草', en: 'CURSIVE' }, family: "'Xingkai SC', 'Xingkai TC', 'STXingkai', 'Kaiti SC', cursive" }
    ];

    // 字形演變列：小篆 → 楷書 → 行草
    function evoRow(char) {
      const row = document.createElement('div');
      row.className = 'evo-row';
      EVO_STAGES.forEach(stage => {
        if (stage.key === 'seal' && !sealReady) return;
        const item = document.createElement('div');
        item.className = 'evo-item';
        const glyph = document.createElement('b');
        glyph.textContent = char;
        glyph.style.fontFamily = stage.family;
        const label = document.createElement('small');
        label.textContent = stage.label[language];
        item.append(glyph, label);
        row.append(item);
      });
      return row;
    }

    // 相遇詳解卡：兩個字的五行由來 + 生剋判定 + 結果
    async function showClash(aTile, bTile, verdictText, resultText, holdMs = 4200) {
      const card = document.createElement('div');
      card.className = 'clash-card';
      const row = document.createElement('div');
      row.className = 'cc-row';
      [aTile, bTile].forEach((tile, i) => {
        if (i === 1) {
          const vs = document.createElement('div');
          vs.className = 'cc-vs';
          vs.textContent = 'VS';
          row.append(vs);
        }
        const fighter = document.createElement('div');
        fighter.className = 'cc-fighter';
        const big = document.createElement('b');
        big.textContent = tile.char;
        big.style.color = EL_COLOR[elementOf(tile.char)];
        const why = document.createElement('small');
        why.textContent = elementWhy(tile.char)[language];
        fighter.append(big, why, evoRow(tile.char));
        row.append(fighter);
      });
      const verdict = document.createElement('div');
      verdict.className = 'cc-verdict';
      verdict.textContent = verdictText;
      const result = document.createElement('div');
      result.className = 'cc-result';
      result.textContent = resultText;
      card.append(row, verdict, result);
      field.append(card);
      await wait(holdMs);
      card.remove();
    }

    /* ---------- 回合流程 ---------- */
    function beginTurn(sideKey) {
      game.phase = 'listen';
      game.turn = sideKey;
      setBanner(sideKey);
      setLive('');
    }

    function acceptSentence(text) {
      if (game.phase !== 'listen') return;
      const chars = [...text].filter(c => HAN.test(c)).slice(0, maxChars());
      if (!chars.length) return;
      const sideKey = game.turn;
      game.squads[sideKey] = chars.map((char, i) => makeTile(char, sideKey, i, chars.length));
      if (game.listening) stopListening();
      if (sideKey === game.starter) {
        beginTurn(sideKey === 'L' ? 'R' : 'L');
      } else {
        resolveBattle();
      }
    }

    async function resolveBattle() {
      game.phase = 'battle';
      setBanner('battle');
      const size = tileSize();
      const midX = field.clientWidth / 2 - size / 2;
      const L = game.squads.L;
      const R = game.squads.R;

      // 智能配對：先把能拼新字的字配到一起，其次能組詞的，剩下按順序
      const usedL = new Set();
      const usedR = new Set();
      const pairs = [];
      [
        (x, z) => recombine(x, z),
        (x, z) => wordOf(x, z)
      ].forEach(match => {
        L.forEach((tileL, i) => {
          if (usedL.has(i)) return;
          for (let j = 0; j < R.length; j += 1) {
            if (usedR.has(j)) continue;
            if (match(tileL.char, R[j].char)) {
              pairs.push([tileL, R[j]]);
              usedL.add(i);
              usedR.add(j);
              return;
            }
          }
        });
      });
      const restL = L.filter((_, i) => !usedL.has(i));
      const restR = R.filter((_, j) => !usedR.has(j));
      const restCount = Math.min(restL.length, restR.length);
      for (let k = 0; k < restCount; k += 1) pairs.push([restL[k], restR[k]]);
      const pairCount = pairs.length;

      for (let i = 0; i < pairCount; i += 1) {
        if (game.phase !== 'battle') return;
        const [a, b] = pairs[i];
        const y = rowY(i, pairCount);
        a.launched = true;
        b.launched = true;
        moveTile(a, midX - size * 0.56, y, 650);
        moveTile(b, midX + size * 0.56, y, 650);
        await wait(700);

        const word = wordOf(a.char, b.char);
        const combo = recombine(a.char, b.char);
        const elA = elementOf(a.char);
        const elB = elementOf(b.char);

        const smash = async winner => {
          const targetX = winner.side === 'L' ? field.clientWidth - size * 0.3 : -size * 0.7;
          moveTile(winner, targetX, y, 500);
          await wait(520);
          burstTile(winner);
          hitPlayer(winner.side === 'L' ? 'R' : 'L');
          game.points[winner.side] += 1;
          await wait(400);
        };

        const speakWhy = `${a.char}，${elementWhy(a.char).zhs}。${b.char}，${elementWhy(b.char).zhs}。`;

        const wordAlly = async (verdictText, speakVerdict) => {
          // 相生（或同氣）：組成新詞
          if (!word) return false;
          speakText(`${speakWhy}${speakVerdict}组成新词，${word}！`);
          await showClash(a, b, verdictText, pageStrings.resultWord[language](word));
          burstTile(a);
          burstTile(b);
          spawnNewChar(word, 'L', y);
          spawnNewChar(word, 'R', y);
          game.points.L += 2;
          game.points.R += 2;
          game.newChars.push(word);
          updateHud();
          await wait(1400);
          return true;
        };

        if (combo) {
          // 偏旁能拼出新字：立刻拆解重組！
          const [n1, n2] = combo;
          const [l1, r1] = PARTS.d[a.char];
          const [l2, r2] = PARTS.d[b.char];
          speakText(`${a.char}，${l1}加${r1}。${b.char}，${l2}加${r2}。偏旁换一换！${n1}！${n2}！`);
          await comboSwap(a, b, n1, n2, y, size, midX);
          await showNewCharCard(n1, n2, game.level === 1 ? 9000 : 5200);
          spawnNewChar(n1, 'L', y);
          spawnNewChar(n2, 'R', y);
          game.points.L += 2;
          game.points.R += 2;
          game.newChars.push(n1, n2);
          updateHud();
          await wait(1500);
        } else if (elA && elB && (KE[elA] === elB || KE[elB] === elA)) {
          // 相剋：剋者勝，弱字碎裂，強字直衝對方
          const winner = KE[elA] === elB ? a : b;
          const loser = winner === a ? b : a;
          const story = KE_STORY[elementOf(winner.char) + elementOf(loser.char)];
          speakText(`${speakWhy}${story.zhs}！${winner.char}获胜！`);
          await showClash(a, b, story[language], pageStrings.resultKe[language](winner.char));
          burstTile(loser);
          await smash(winner);
        } else if (elA && elB && (SHENG[elA] === elB || SHENG[elB] === elA)) {
          // 相生：能組詞或拼新字；都不行就共生共榮
          const pairKey = SHENG[elA] === elB ? elA + elB : elB + elA;
          const story = SHENG_STORY[pairKey];
          const done = await wordAlly(story[language], `${story.zhs}！`);
          if (!done) {
            speakText(`${speakWhy}${story.zhs}！共生共荣！`);
            await showClash(a, b, story[language], pageStrings.resultShengPeace[language]);
            burstTile(a);
            burstTile(b);
            game.points.L += 1;
            game.points.R += 1;
            updateHud();
            await wait(500);
          }
        } else {
          // 同屬一行或無五行：先組詞，再比組字力——
          // 能和場上任何字（含雙方句子與戰利品）拼出新字的勝出
          const sameElement = elA && elA === elB;
          const done = await wordAlly(
            sameElement ? pageStrings.verdictSameAlly[language](elA) : pageStrings.verdictAlly[language],
            sameElement ? `同属${elA}，同气连枝！` : '字字有缘！');
          if (!done) {
            const onScreen = [...L, ...R].map(tile => tile.char)
              .concat([...document.getElementById('shelfL').children].map(chip => chip.textContent))
              .concat([...document.getElementById('shelfR').children].map(chip => chip.textContent));
            const fa = forgePower(a.char, onScreen);
            const fb = forgePower(b.char, onScreen);
            if (fa.count !== fb.count) {
              const winner = fa.count > fb.count ? a : b;
              const loser = winner === a ? b : a;
              const power = fa.count > fb.count ? fa : fb;
              speakText(`${speakWhy}${winner.char}能和${power.sample.partner}拼成${power.sample.made}，组字力胜出！`);
              await showClash(a, b, pageStrings.verdictForge[language],
                pageStrings.resultForge[language](winner.char, power.sample.partner, power.sample.made));
              burstTile(loser);
              await smash(winner);
            } else {
              speakText(`${speakWhy}势均力敌，同归于尽！`);
              await showClash(a, b, pageStrings.verdictForge[language], pageStrings.resultTie[language]);
              burstTile(a);
              burstTile(b);
              await wait(500);
            }
          }
        }
        if (game.phase === 'over') return;
      }

      // 多出來的字直衝對方
      const extras = restL.length > restR.length ? restL.slice(restCount) : restR.slice(restCount);
      for (const tile of extras) {
        if (game.phase !== 'battle') return;
        tile.launched = true;
        const targetX = tile.side === 'L' ? field.clientWidth - size * 0.3 : -size * 0.7;
        moveTile(tile, targetX, rowY(tile.index, tile.total), 500);
        await wait(520);
        burstTile(tile);
        hitPlayer(tile.side === 'L' ? 'R' : 'L');
        game.points[tile.side] += 1;
        if (game.phase === 'over') return;
        await wait(300);
      }

      game.squads = { L: [], R: [] };
      game.round += 1;
      game.starter = game.starter === 'L' ? 'R' : 'L';
      updateHud();
      await wait(600);
      if (game.phase === 'battle') beginTurn(game.starter);
    }

    function spawnNewChar(char, sideKey, y) {
      const size = tileSize();
      const el = document.createElement('div');
      el.className = 'tile newborn';
      if (char.length > 1) el.classList.add('wordborn');
      el.style.setProperty('--tile', `${size}px`);
      el.textContent = char;
      const pinyin = char.length > 1
        ? [...char].map(c => PARTS.p[c] || '').join(' ').trim()
        : PARTS.p[char];
      if (pinyin) {
        const small = document.createElement('small');
        small.textContent = pinyin;
        el.append(small);
      }
      const midX = field.clientWidth / 2 - size / 2;
      el.style.transform = `translate(${midX + (sideKey === 'L' ? -size * 0.7 : size * 0.7)}px, ${y}px)`;
      field.append(el);
      el.addEventListener('pointerdown', () => speakText(char));
      // 飛向自己的戰利品架
      setTimeout(() => {
        el.style.transitionDuration = '800ms';
        const targetX = sideKey === 'L' ? -size : field.clientWidth + size;
        el.style.transform = `translate(${targetX}px, ${field.clientHeight * 0.55}px) scale(.4)`;
      }, 1000);
      setTimeout(() => {
        el.remove();
        addToShelf(char, sideKey);
      }, 1800);
    }

    function addToShelf(char, sideKey) {
      const shelf = document.getElementById(sideKey === 'L' ? 'shelfL' : 'shelfR');
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = char;
      chip.title = PARTS.p[char] || '';
      chip.addEventListener('click', () => speakText(char));
      shelf.append(chip);
    }

    function hitPlayer(sideKey) {
      game.hp[sideKey] = Math.max(0, game.hp[sideKey] - 1);
      const face = document.getElementById(sideKey === 'L' ? 'faceL' : 'faceR');
      face.classList.add('is-hit');
      setTimeout(() => face.classList.remove('is-hit'), 450);
      updateHud();
      if (game.hp[sideKey] === 0) endGame(sideKey === 'L' ? 'R' : 'L');
    }

    /* ---------- 開始 / 結束 ---------- */
    function resetGame() {
      field.querySelectorAll('.tile').forEach(el => el.remove());
      document.getElementById('shelfL').innerHTML = '';
      document.getElementById('shelfR').innerHTML = '';
      game.hp = { L: 5, R: 5 };
      game.points = { L: 0, R: 0 };
      game.squads = { L: [], R: [] };
      game.newChars = [];
      game.round = 1;
      game.starter = 'L';
      updateHud();
    }

    function startGame() {
      resetGame();
      typeInput.placeholder = pageStrings[`typePlaceholder${game.level}`][language];
      startOverlay.classList.remove('is-visible');
      endOverlay.classList.remove('is-visible');
      beginTurn(game.starter);
    }

    function endGame(winner) {
      game.phase = 'over';
      if (game.listening) stopListening();
      document.getElementById('winnerTitle').textContent =
        winner === 'L' ? pageStrings.winLeft[language] : pageStrings.winRight[language];
      document.getElementById('endStats').textContent =
        pageStrings.statsTemplate[language]({ rounds: game.round, newChars: game.newChars.length });
      const box = document.getElementById('wonChars');
      box.innerHTML = '';
      [...new Set(game.newChars)].slice(0, 30).forEach(char => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.textContent = char;
        chip.addEventListener('click', () => speakText(char));
        box.append(chip);
      });
      document.getElementById('retryButton').textContent =
        (game.level === 1 ? pageStrings.nextLevel : pageStrings.again)[language];
      endOverlay.classList.add('is-visible');
    }

    document.getElementById('startL1').addEventListener('click', () => { unlockTTS(); game.level = 1; startGame(); });
    document.getElementById('startL2').addEventListener('click', () => { unlockTTS(); game.level = 2; startGame(); });
    document.getElementById('retryButton').addEventListener('click', () => {
      unlockTTS();
      if (game.level === 1) game.level = 2;
      startGame();
    });

    /* ---------- 朗讀（穩定版） ---------- */
    let resumeAfterSpeech = false;
    let speakTimer = null;
    let resumeTimer = null;
    let currentUtterance = null;
    let ttsVoices = [];
    let ttsUnlocked = false;

    if ('speechSynthesis' in window) {
      const loadVoices = () => { ttsVoices = window.speechSynthesis.getVoices(); };
      loadVoices();
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }

    function unlockTTS() {
      if (ttsUnlocked || !('speechSynthesis' in window)) return;
      ttsUnlocked = true;
      const utterance = new SpeechSynthesisUtterance(' ');
      utterance.volume = 0;
      window.speechSynthesis.speak(utterance);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      const synth = window.speechSynthesis;
      let justAborted = false;
      if (game.listening && recognition && !resumeAfterSpeech) {
        resumeAfterSpeech = true;
        justAborted = true;
        recognition.abort();
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      const voice = ttsVoices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith('zh-cn'))
        || ttsVoices.find(v => v.lang.toLowerCase().startsWith('zh'));
      if (voice) utterance.voice = voice;
      utterance.rate = 0.85;
      utterance.volume = 1;
      currentUtterance = utterance;
      const finish = () => {
        clearTimeout(resumeTimer);
        resumeTimer = setTimeout(() => {
          if (resumeAfterSpeech && game.listening && !synth.speaking && !synth.pending) {
            resumeAfterSpeech = false;
            try { startRecognition(); } catch { stopListening(); }
          }
        }, 300);
      };
      utterance.onend = finish;
      utterance.onerror = finish;
      const go = () => { synth.resume(); synth.speak(utterance); };
      clearTimeout(speakTimer);
      if (synth.speaking || synth.pending) {
        synth.cancel();
        speakTimer = setTimeout(go, 100);
      } else if (justAborted) {
        speakTimer = setTimeout(go, 180);
      } else {
        go();
      }
      finish();
    }

    /* ---------- 語音識別（每回合聽一句） ---------- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function startRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      let gotFinal = false;

      recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const text = result[0].transcript.trim();
          if (!text) continue;
          if (result.isFinal) {
            gotFinal = true;
            setLive(pageStrings.heard[language], text);
            acceptSentence(text);
          } else {
            setLive(pageStrings.heard[language], text);
          }
        }
      };

      recognition.onerror = event => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          stopListening();
          setLive(pageStrings.denied[language]);
        }
      };

      recognition.onend = () => {
        if (game.listening && !resumeAfterSpeech) {
          stopListening();
          if (!gotFinal && game.phase === 'listen') setLive(pageStrings.noSpeech[language]);
        }
      };

      recognition.start();
    }

    function stopListening() {
      game.listening = false;
      micButton.classList.remove('is-listening');
      if (recognition) { recognition.onend = null; recognition.abort(); }
    }

    micButton.addEventListener('click', () => {
      unlockTTS();
      if (game.listening) { stopListening(); setLive(''); return; }
      if (game.phase !== 'listen') return;
      game.listening = true;
      micButton.classList.add('is-listening');
      setLive(pageStrings[`listening${game.level}`][language]);
      try { startRecognition(); } catch { stopListening(); }
    });

    if (!SpeechRecognition) {
      micButton.disabled = true;
      setLive(pageStrings.unsupported[language]);
    }

    typeForm.addEventListener('submit', event => {
      event.preventDefault();
      unlockTTS();
      const text = typeInput.value.trim();
      if (text) acceptSentence(text);
      typeInput.value = '';
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && game.listening) stopListening();
    });

    updateHud();
    applyLanguage(language);
  </script>
</body>
