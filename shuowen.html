<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小道士說文解字 — Chinese.org</title>
  <meta name="description" content="會講故事的小道士：你問一個字，他翻開《說文解字》，講出這個字的來歷——本義、部件、字形演變、組詞和詩句。">
  <meta name="theme-color" content="#0b0b0a">
  <meta property="og:title" content="小道士說文解字 — Chinese.org">
  <meta property="og:description" content="每個漢字，都有一個故事。">
  <meta property="og:image" content="https://chinese.org/assets/og-premium.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chinese.org/shuowen.html">
  <link rel="icon" href="assets/logo-hua.png" type="image/png">
  <style>
    :root {
      --ink: #0b0b0a;
      --ink-soft: #161714;
      --paper: #f1eee6;
      --coral: #e36a4c;
      --gold: #c39a54;
      --led-gold: #ffd98a;
      --led-red: #ff6b52;
      --jade: #7fd8b8;
      --blue: #7ab8ff;
      --muted: rgba(241, 238, 230, .52);
      --line: rgba(241, 238, 230, .14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "PingFang TC", "Hiragino Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      padding-top: calc(8px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 10, .92);
      z-index: 20;
    }

    .bar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--paper);
      text-decoration: none;
    }

    .bar-brand img { width: 24px; height: 24px; filter: invert(1); }

    .bar-brand strong { font-size: 10px; font-weight: 800; letter-spacing: .16em; }

    .bar-title {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--led-gold);
    }

    .bar-spacer { width: 90px; text-align: right; font-size: 18px; }

    /* ---------- 故事區 ---------- */
    .story {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 16px 30px;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at 50% -10%, rgba(195, 154, 84, .12), transparent 50%),
        var(--ink);
    }

    .story::-webkit-scrollbar { width: 0; }

    .row {
      display: flex;
      gap: 10px;
      max-width: 640px;
      margin: 0 auto 14px;
      animation: rise 400ms ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row .avatar {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 30px;
      border: 1px solid rgba(195, 154, 84, .5);
      border-radius: 50%;
      background: rgba(195, 154, 84, .12);
    }

    .bubble {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 4px 16px 16px 16px;
      background: rgba(255, 255, 255, .045);
      font-size: 15px;
      line-height: 1.9;
    }

    .bubble.classic {
      border-color: rgba(195, 154, 84, .45);
      background: rgba(195, 154, 84, .08);
      font-family: "Songti SC", "Songti TC", "STSong", serif;
      font-size: 16px;
      color: var(--led-gold);
    }

    .bubble.classic small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); font-family: "Avenir Next", "PingFang SC", sans-serif; }

    .bubble b.hl { color: var(--jade); font-weight: 700; }

    .bubble .src { display: block; margin-top: 2px; font-size: 11px; color: rgba(241, 238, 230, .38); }

    /* 主字卡 */
    .hero-char {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
      padding: 16px;
    }

    .hero-char .big {
      font-size: 92px;
      font-weight: 800;
      line-height: 1.05;
      color: var(--led-gold);
      text-shadow: 0 0 26px rgba(255, 217, 138, .45);
    }

    .hero-char .meta { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

    .hero-char .py { font-size: 24px; font-weight: 700; color: var(--jade); }

    .hero-char .tag {
      padding: 2px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }

    .evo-row { display: flex; gap: 14px; }

    .evo-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }

    .evo-item b { font-size: 40px; font-weight: 400; color: var(--paper); line-height: 1.15; }

    .evo-item small { font-size: 9px; color: rgba(241, 238, 230, .42); letter-spacing: .12em; }

    .etym-link {
      padding: 2px 10px;
      border: 1px solid rgba(122, 184, 255, .45);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: .06em;
      color: var(--blue);
      text-decoration: none;
    }

    /* ---------- 輸入區 ---------- */
    .ask {
      border-top: 1px solid var(--line);
      background: var(--ink-soft);
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }

    .chips button {
      padding: 4px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 15px;
      color: var(--muted);
    }

    .ask-row { display: flex; align-items: center; justify-content: center; gap: 10px; }

    .mic {
      position: relative;
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: linear-gradient(160deg, #ff7a54, #a83a28);
      box-shadow: 0 8px 26px rgba(227, 106, 76, .4);
    }

    .mic:active { transform: scale(.94); }

    .mic[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; }

    .mic.is-listening::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 2px solid rgba(255, 122, 84, .8);
      border-radius: 50%;
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.92); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .typebox { display: flex; flex: 1; max-width: 340px; gap: 6px; }

    .typebox input {
      flex: 1;
      min-width: 0;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      color: var(--paper);
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    .typebox input:focus { border-color: var(--coral); }

    .typebox button {
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(227, 106, 76, .22);
      border: 1px solid var(--coral);
      font-size: 15px;
    }

    .live {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="bar-brand" href="index.html" aria-label="回到 Chinese.org 首頁">
      <img src="assets/logo-hua.png" alt="">
      <strong>CHINESE.ORG</strong>
    </a>
    <p class="bar-title" data-zht="小道士說文解字" data-zhs="小道士说文解字" data-en="Little Taoist's Shuowen">小道士說文解字</p>
    <span class="bar-spacer">☯️</span>
  </header>

  <main class="story" id="story"></main>

  <footer class="ask">
    <div class="chips" id="chips"></div>
    <div class="ask-row">
      <button class="mic" id="micButton" type="button" aria-label="說一個字">🎤</button>
      <form class="typebox" id="typeForm">
        <input id="typeInput" type="text" maxlength="4" autocomplete="off" placeholder="想問哪個字？">
        <button type="submit" data-zht="問！" data-zhs="问！" data-en="Ask!">問！</button>
      </form>
    </div>
    <p class="live" id="liveLine"></p>
  </footer>

  <script src="opencc-t2cn.js"></script>
  <script src="tangshi300.js"></script>
  <script src="hanzi-parts.js"></script>
  <script src="wuxing-ciyu.js?v=2"></script>
  <script src="shuowen-data.js"></script>
  <script>
    /* ---------- 語言 ---------- */
    const translatable = document.querySelectorAll('[data-zht][data-zhs][data-en]');
    let language = localStorage.getItem('chinese_language') || 'zht';

    const pageStrings = {
      title: { zht: '小道士說文解字 — Chinese.org', zhs: '小道士说文解字 — Chinese.org', en: "Little Taoist's Shuowen — Chinese.org" },
      placeholder: { zht: '想問哪個字？', zhs: '想问哪个字？', en: 'Which character?' },
      listening: { zht: '我在聽……說出你想問的字！', zhs: '我在听……说出你想问的字！', en: 'Listening… say a character!' },
      denied: { zht: '需要麥克風權限，也可以打字問。', zhs: '需要麦克风权限，也可以打字问。', en: 'Mic access needed—typing works too.' },
      unsupported: { zht: '這個瀏覽器不支援語音識別，打字問也一樣。', zhs: '这个浏览器不支持语音识别，打字问也一样。', en: 'No speech recognition—type instead.' }
    };

    function applyLanguage(next) {
      language = next;
      localStorage.setItem('chinese_language', language);
      translatable.forEach(el => { el.textContent = el.dataset[language]; });
      document.title = pageStrings.title[language];
      typeInput.placeholder = pageStrings.placeholder[language];
    }

    /* ---------- 資料 ---------- */
    const toSimplified = window.OpenCC ? window.OpenCC.Converter({ from: 't', to: 'cn' }) : (t => t);
    const PARTS = window.HANZI_PARTS || { d: {}, c: {}, p: {} };
    const SHUOWEN = window.SHUOWEN || {};
    const WORDS_OF = window.CIYU_BY_CHAR || {};
    const HAN = /[㐀-鿿]/;

    const RADICAL_OF = {};
    const ELEMENT_OF = {};
    Object.entries(window.HANZI_WUXING || {}).forEach(([char, value]) => {
      ELEMENT_OF[char] = value[0];
      RADICAL_OF[char] = value.slice(1);
    });

    // 常見部首的「小故事」含義
    const RADICAL_STORY = {
      '水': '跟水有關', '氵': '跟水有關', '冫': '跟冰有關', '手': '用手做的動作', '扌': '用手做的動作',
      '木': '跟樹木有關', '艹': '跟花草有關', '口': '跟嘴巴有關', '心': '跟心情有關', '忄': '跟心情有關',
      '火': '跟火有關', '灬': '跟火有關', '亻': '跟人有關', '人': '跟人有關', '女': '跟女子有關',
      '土': '跟泥土有關', '石': '跟石頭有關', '日': '跟太陽有關', '月': '跟月亮或身體有關', '雨': '跟天氣有關',
      '金': '跟金屬有關', '钅': '跟金屬有關', '糸': '跟絲線有關', '纟': '跟絲線有關', '足': '跟腳有關',
      '目': '跟眼睛有關', '馬': '跟馬有關', '鳥': '跟鳥有關', '魚': '跟魚有關', '犬': '跟動物有關', '犭': '跟動物有關',
      '玉': '跟美玉有關', '王': '跟美玉有關', '言': '跟說話有關', '讠': '跟說話有關', '辵': '跟走路有關', '辶': '跟走路有關',
      '宀': '跟房屋有關', '門': '跟門有關', '车': '跟車有關', '車': '跟車有關', '刀': '跟刀有關', '刂': '跟刀有關',
      '弓': '跟弓箭有關', '山': '跟山有關', '田': '跟田地有關', '米': '跟糧食有關', '衣': '跟衣服有關', '衤': '跟衣服有關',
      '食': '跟吃有關', '飠': '跟吃有關', '竹': '跟竹子有關', '頁': '跟頭有關', '疒': '跟生病有關', '虫': '跟小蟲子有關'
    };

    // 唐詩例句（懶載入）
    let POEM_LINES = null;

    function findPoemLine(char) {
      if (!POEM_LINES) {
        POEM_LINES = [];
        (window.TANGSHI_300 || []).forEach(poem => {
          const title = toSimplified(poem.title || '');
          const author = toSimplified(poem.author || '');
          poem.paragraphs.forEach(paragraph => {
            const simplified = toSimplified(paragraph);
            const clausesT = paragraph.split(/[，。！？；：、\s]+/);
            simplified.split(/[，。！？；：、\s]+/).forEach((clauseS, i) => {
              if (clauseS.length >= 3 && clauseS.length <= 9) {
                POEM_LINES.push({ text: clauseS, textT: clausesT[i] || clauseS, title, author });
              }
            });
          });
        });
      }
      return POEM_LINES.find(line => line.text.includes(char)) || null;
    }

    /* ---------- 篆體字體 ---------- */
    let sealReady = false;
    if (window.FontFace && document.fonts) {
      const sealFont = new FontFace('ChongXi Seal', "url('assets/chongxi_seal.otf')", { display: 'swap' });
      sealFont.load().then(loaded => { document.fonts.add(loaded); sealReady = true; }).catch(() => {});
    }

    const EVO_STAGES = [
      { key: 'seal', label: { zht: '小篆', zhs: '小篆', en: 'SEAL' }, family: "'ChongXi Seal', serif" },
      { key: 'kai', label: { zht: '楷書', zhs: '楷书', en: 'KAI' }, family: "'Kaiti SC', 'Kaiti TC', 'STKaiti', 'DFKai-SB', 'BiauKai', serif" },
      { key: 'xing', label: { zht: '行草', zhs: '行草', en: 'CURSIVE' }, family: "'Xingkai SC', 'Xingkai TC', 'STXingkai', 'Kaiti SC', cursive" }
    ];

    function evoRow(char) {
      const row = document.createElement('div');
      row.className = 'evo-row';
      EVO_STAGES.forEach(stage => {
        if (stage.key === 'seal' && !sealReady) return;
        const item = document.createElement('div');
        item.className = 'evo-item';
        const glyph = document.createElement('b');
        glyph.textContent = char;
        glyph.style.fontFamily = stage.family;
        const label = document.createElement('small');
        label.textContent = stage.label[language];
        item.append(glyph, label);
        row.append(item);
      });
      return row;
    }

    /* ---------- 朗讀（順序講故事版） ---------- */
    let ttsVoices = [];
    let ttsUnlocked = false;
    let storyToken = 0;

    if ('speechSynthesis' in window) {
      const loadVoices = () => { ttsVoices = window.speechSynthesis.getVoices(); };
      loadVoices();
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }

    function unlockTTS() {
      if (ttsUnlocked || !('speechSynthesis' in window)) return;
      ttsUnlocked = true;
      const utterance = new SpeechSynthesisUtterance(' ');
      utterance.volume = 0;
      window.speechSynthesis.speak(utterance);
    }

    function speakAsync(text) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window) || !text) { resolve(); return; }
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        const voice = ttsVoices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith('zh-cn'))
          || ttsVoices.find(v => v.lang.toLowerCase().startsWith('zh'));
        if (voice) utterance.voice = voice;
        utterance.rate = 0.88;
        utterance.volume = 1;
        let settled = false;
        const done = () => { if (!settled) { settled = true; resolve(); } };
        utterance.onend = done;
        utterance.onerror = done;
        // 事件不觸發時的兜底（按字數估時）
        setTimeout(done, Math.min(30000, 1800 + text.length * 320));
        const go = () => { synth.resume(); synth.speak(utterance); };
        if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(go, 100); }
        else go();
      });
    }

    /* ---------- 故事構建 ---------- */
    const story = document.getElementById('story');
    const liveLine = document.getElementById('liveLine');
    const micButton = document.getElementById('micButton');
    const typeForm = document.getElementById('typeForm');
    const typeInput = document.getElementById('typeInput');

    function addRow(content, opts = {}) {
      const row = document.createElement('div');
      row.className = 'row';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '👲';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (opts.classic ? ' classic' : '');
      if (typeof content === 'string') bubble.innerHTML = content;
      else bubble.append(content);
      row.append(avatar, bubble);
      story.append(row);
      story.scrollTop = story.scrollHeight;
      return bubble;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 從說文原文提取造字法與故事
    function interpret(char, entry) {
      const zhu = { parts: [], speak: [] };
      const explanation = entry ? entry.e : '';
      const gist = explanation.split(/[。；]/)[0] || '';
      if (gist) {
        zhu.parts.push(`它的本義是——<b class="hl">${escapeHtml(gist)}</b>。`);
        zhu.speak.push(`它的本义是，${gist}。`);
      }
      const xingsheng = explanation.match(/从(.)[，,]?(.)聲/);
      const huiyi = explanation.match(/从(.)[，,]?从(.)/);
      if (xingsheng) {
        const [, meaning, sound] = xingsheng;
        const radicalStory = RADICAL_STORY[meaning] || `跟「${meaning}」有關`;
        zhu.parts.push(`它是<b class="hl">形聲字</b>：「${meaning}」表示意思（${radicalStory}），「${sound}」提示讀音。`);
        zhu.speak.push(`它是形声字：${meaning}，表示意思，${radicalStory}；${sound}，提示读音。`);
      } else if (huiyi) {
        const [, first, second] = huiyi;
        zhu.parts.push(`它是<b class="hl">會意字</b>：「${first}」和「${second}」合在一起，拼出了它的意思。`);
        zhu.speak.push(`它是会意字：${first}和${second}合在一起，拼出了它的意思。`);
      } else if (/象形/.test(explanation)) {
        zhu.parts.push(`它是<b class="hl">象形字</b>——古人照著它的樣子，一筆一筆畫出來的！`);
        zhu.speak.push('它是象形字，古人照着它的样子画出来的。');
      } else if (/指事|𢫾事/.test(explanation)) {
        zhu.parts.push(`它是<b class="hl">指事字</b>——古人用記號指出它的意思。`);
        zhu.speak.push('它是指事字，古人用记号指出它的意思。');
      }
      if (!entry && PARTS.d[char]) {
        const [l, r] = PARTS.d[char];
        zhu.parts.push(`《說文解字》裡還沒有它——它是後來才造的字！拆開看：「${l}」加「${r}」。`);
        zhu.speak.push(`说文解字里还没有它，它是后来才造的字。拆开看，${l}加${r}。`);
      }
      return zhu;
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function tellStory(char) {
      const token = ++storyToken;
      if (game_listening) stopListening();
      const entry = SHUOWEN[char] || SHUOWEN[toSimplified(char)] || null;
      const pinyin = (entry && entry.p) || PARTS.p[char] || '';
      const radical = (entry && entry.r) || RADICAL_OF[char] || (PARTS.d[char] ? PARTS.d[char][0] : '');

      // ① 開場 + 主字卡
      const heroWrap = document.createElement('div');
      const intro = document.createElement('div');
      intro.innerHTML = `你問的是「<b class="hl">${escapeHtml(char)}</b>」呀！讓我翻翻《說文解字》……`;
      const hero = document.createElement('div');
      hero.className = 'hero-char';
      const big = document.createElement('div');
      big.className = 'big';
      big.textContent = char;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const py = document.createElement('div');
      py.className = 'py';
      py.textContent = pinyin;
      meta.append(py);
      if (radical) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = (language === 'en' ? 'radical ' : '部首：') + radical + (ELEMENT_OF[char] ? ` · 五行${ELEMENT_OF[char]}` : '');
        meta.append(tag);
      }
      meta.append(evoRow(char));
      const etym = document.createElement('a');
      etym.className = 'etym-link';
      etym.href = `https://hanziyuan.net/#${encodeURIComponent(char)}`;
      etym.target = '_blank';
      etym.rel = 'noreferrer';
      etym.textContent = '字源：甲骨文·金文 ↗';
      meta.append(etym);
      hero.append(big, meta);
      heroWrap.append(intro, hero);
      addRow(heroWrap);
      await speakAsync(`你问的是，${char}！让我翻翻说文解字。`);
      if (token !== storyToken) return;

      // ② 說文原文
      if (entry) {
        addRow(`《說文解字》：「${escapeHtml(entry.e)}」<small>—— 東漢·許慎</small>`, { classic: true });
        await speakAsync(`说文解字说：${char}，${entry.e}`);
        if (token !== storyToken) return;
      }

      // ③ 小道士解讀
      const zhu = interpret(char, entry);
      if (zhu.parts.length) {
        addRow(zhu.parts.join('<br>'));
        await speakAsync(zhu.speak.join(''));
        if (token !== storyToken) return;
      }

      // ④ 組詞與詩句
      const words = (WORDS_OF[char] || []).slice(0, 2);
      const line = findPoemLine(toSimplified(char));
      const pieces = [];
      const speakPieces = [];
      if (words.length) {
        pieces.push(`現在人們常用它組詞：<b class="hl">${words.join('、')}</b>。`);
        speakPieces.push(`现在人们常用它组词：${words.join('，')}。`);
      }
      if (line) {
        pieces.push(`唐詩裡也有它：「<b class="hl">${escapeHtml(language === 'zht' ? line.textT : line.text)}</b>」<span class="src">—— ${escapeHtml(line.author)}《${escapeHtml(line.title)}》</span>`);
        speakPieces.push(`唐诗里也有它：${line.text}。`);
      }
      if (pieces.length) {
        addRow(pieces.join('<br>'));
        await speakAsync(speakPieces.join(''));
        if (token !== storyToken) return;
      }

      // ⑤ 收尾
      addRow(language === 'en' ? 'Remember it! Which character next? ☯️' : '記住咯！還想問哪個字？☯️');
      await speakAsync('记住咯！还想问哪个字？');
    }

    /* ---------- 語音識別（問一個字） ---------- */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let game_listening = false;

    function setLive(text) { liveLine.textContent = text; }

    function startRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const text = result[0].transcript.trim();
          if (!text) continue;
          setLive(text);
          if (result.isFinal) {
            const char = [...text].find(c => HAN.test(c));
            if (char) tellStory(char);
          }
        }
      };
      recognition.onerror = event => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          stopListening();
          setLive(pageStrings.denied[language]);
        }
      };
      recognition.onend = () => { stopListening(); };
      recognition.start();
    }

    function stopListening() {
      game_listening = false;
      micButton.classList.remove('is-listening');
      if (recognition) { recognition.onend = null; recognition.abort(); }
    }

    micButton.addEventListener('click', () => {
      unlockTTS();
      if (game_listening) { stopListening(); setLive(''); return; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      game_listening = true;
      micButton.classList.add('is-listening');
      setLive(pageStrings.listening[language]);
      try { startRecognition(); } catch { stopListening(); }
    });

    if (!SpeechRecognition) {
      micButton.disabled = true;
      setLive(pageStrings.unsupported[language]);
    }

    typeForm.addEventListener('submit', event => {
      event.preventDefault();
      unlockTTS();
      const char = [...typeInput.value.trim()].find(c => HAN.test(c));
      if (char) tellStory(char);
      typeInput.value = '';
    });

    /* ---------- 推薦字 ---------- */
    const SUGGESTED = ['江', '山', '火', '馬', '心', '龍', '雨', '打'];
    const chips = document.getElementById('chips');
    SUGGESTED.forEach(char => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = char;
      chip.addEventListener('click', () => { unlockTTS(); tellStory(char); });
      chips.append(chip);
    });

    /* ---------- 開場白 ---------- */
    addRow(language === 'en'
      ? 'Greetings! I am the little Taoist of characters ☯️ Ask me any character—every one has a story from the ancient <i>Shuowen Jiezi</i>. Tap the mic and say one, type one, or pick one below!'
      : '貧道有禮啦！我是漢字小道士 ☯️ 每個漢字都有自己的故事，都寫在一千九百年前的《說文解字》裡。按麥克風說一個字、打一個字，或者點下面的字試試！');

    applyLanguage(language);
  </script>
</body>
</html>
